<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hexapod Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Navbar: symbols only. Horizontal across the top in portrait,
         vertical down the left in landscape (CSS-driven). -->
    <nav id="navbar">
      <!-- Connection: wifi on/off symbol (slash shows when disconnected).
           Tap to show the host and a disconnect/reconnect toggle. -->
      <button id="conn-status" class="nav-icon" aria-label="Connection status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5a12 12 0 0 1 16 0"/>
          <path d="M7.5 15a7 7 0 0 1 9 0"/>
          <path d="M10.5 18.3a2.5 2.5 0 0 1 3 0"/>
          <circle cx="12" cy="20.5" r="0.6" fill="currentColor" stroke="none"/>
          <line class="wifi-slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>

      <div class="nav-spacer"></div>

      <!-- Controller: green when a controller is active. Tap for status. -->
      <button id="controller-btn" class="nav-icon" aria-label="Controller">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="11" rx="4"/>
          <line x1="7" y1="11" x2="7" y2="14"/>
          <line x1="5.5" y1="12.5" x2="8.5" y2="12.5"/>
          <circle cx="16" cy="11.5" r="1" fill="currentColor" stroke="none"/>
          <circle cx="18.5" cy="14" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <!-- Mode: the operator preset (NORMAL / QUAD). The icon doubles as a
           leg-set readout — the two middle legs dim when the robot is standing
           on four — so the current mode is visible without opening the view.
           Tap toggles the Mode view in and out. -->
      <button id="preset-btn" class="nav-icon" aria-label="Mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="6" width="8" height="12" rx="2"/>
          <line x1="8" y1="8.5" x2="4" y2="6"/>
          <line x1="16" y1="8.5" x2="20" y2="6"/>
          <line class="preset-mid-leg" x1="8" y1="12" x2="3.5" y2="12"/>
          <line class="preset-mid-leg" x1="16" y1="12" x2="20.5" y2="12"/>
          <line x1="8" y1="15.5" x2="4" y2="18"/>
          <line x1="16" y1="15.5" x2="20" y2="18"/>
        </svg>
      </button>

      <!-- Log -->
      <button id="log-btn" class="nav-icon" aria-label="Log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <line x1="8" y1="8" x2="16" y2="8"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="8" y1="16" x2="13" y2="16"/>
        </svg>
      </button>
    </nav>

    <div id="control-area">
      <div class="joystick" id="left-joystick">
        <canvas id="left-canvas"></canvas>
        <span class="joystick-label">Left</span>
      </div>

      <!-- Center column: status strip over the button grid. The strip is a
           sibling of the grid, not inside it, so it stays visible while the
           control prompt replaces the grid — a controller owner switching
           gaits is exactly when the passive observer wants to see it. -->
      <div id="center-panel">
        <div id="status-bar">
          <!-- The preset, because the navbar icon cannot carry it: that icon
               shows the LEG SET, and NORMAL / FAST / OFFROAD all stand on six
               legs, so without this the operator cannot tell which is in
               force without opening the Mode view. -->
          <span class="status-item">
            <span class="status-key">Mode</span>
            <span class="status-value" id="status-preset">&mdash;</span>
          </span>
          <span class="status-item">
            <span class="status-key">Gait</span>
            <span class="status-value" id="status-gait">&mdash;</span>
          </span>
          <span class="status-item">
            <span class="status-key">Anim</span>
            <span class="status-value" id="status-animation">&mdash;</span>
          </span>
          <!-- Pack voltage + current, polled over the WebSocket. Real robot
               only; a dash where nothing publishes telemetry. -->
          <span class="status-item">
            <span class="status-key">Pack</span>
            <span class="status-value" id="status-battery">&mdash;</span>
          </span>
        </div>

        <!-- 3x3 grid. DOM order is visual order; JS keys off data-index.
             Row 1: mode select. Row 2/3: per-mode actions, init centred,
             prev/next stacked at center-left/bottom-left, body up/down right. -->
        <div id="button-grid">
          <button class="mode-btn" data-index="0"></button>
          <button class="mode-btn" data-index="1"></button>
          <button class="mode-btn" data-index="2"></button>
          <button class="action-btn" data-index="5"></button>
          <button class="action-btn" data-index="3"></button>
          <button class="action-btn" data-index="7"></button>
          <button class="action-btn" data-index="6"></button>
          <button class="action-btn" data-index="4"></button>
          <button class="action-btn" data-index="8"></button>
        </div>

        <!-- Replaces the button grid in place while a controller is active. -->
        <div id="control-prompt" class="hidden">
          <p>The hexapod is currently being controlled by a game controller</p>
          <button id="take-control-btn">Take control</button>
        </div>
      </div>

      <div class="joystick" id="right-joystick">
        <canvas id="right-canvas"></canvas>
        <span class="joystick-label">Right</span>
      </div>
    </div>

    <!-- Mode view. Replaces the control area in place, keeping the navbar and
         — crucially — the WebSocket: pending and refused are live states that
         only the socket carries, so this is a view in this page and not a page
         like logs.html. Reachable in every state, including while the
         take-control prompt has replaced the button grid, which is what makes a
         mode switch possible while a controller drives. -->
    <div id="preset-view" class="hidden">
      <div class="view-header">
        <button id="preset-back" class="nav-icon" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span class="view-title">Mode</span>
      </div>
      <div id="preset-list"></div>

      <!-- Folded only. On the belly the leg set the next stand comes up on is
           chosen by the stand itself (the init button republishes the gait that
           walks the set it asked for), so the mode rows there would move a
           highlight the stand immediately overrides. The rows go inert and the
           view offers the one thing that is meaningful on the belly. -->
      <button id="preset-stand" class="preset-item hidden">
        <span class="preset-label">STAND</span>
        <span class="preset-sub" id="preset-stand-sub"></span>
      </button>

      <p id="preset-note"></p>
    </div>
  </div>

  <!-- Shown when the server already has another device connected. -->
  <div id="busy-overlay" class="overlay hidden">
    <div class="dialog">
      <p>Another device is already controlling the hexapod.</p>
      <p class="dialog-sub">Waiting for it to disconnect…</p>
    </div>
  </div>

  <!-- Connection popover, opened from the navbar connection icon. -->
  <div id="conn-overlay" class="overlay hidden">
    <div class="dialog">
      <p id="conn-state"></p>
      <p id="conn-host" class="dialog-sub"></p>
      <div class="dialog-buttons">
        <button id="conn-toggle"></button>
        <button id="conn-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Controller status popover, opened from the navbar controller icon. -->
  <div id="controller-overlay" class="overlay hidden">
    <div class="dialog">
      <p id="controller-status"></p>
      <div class="dialog-buttons">
        <button id="controller-toggle"></button>
        <button id="controller-close">Close</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
