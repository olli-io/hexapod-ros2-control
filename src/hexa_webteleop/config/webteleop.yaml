# Web teleop config — phone/tablet webapp (two touch joysticks + 9 buttons).
# Keys bind to function names (see joy_mapping.ALL_FUNCTIONS); "" is unbound.
#
# Top 3 buttons (btn_0, btn_1, btn_2) are fixed mode-select buttons in
# base.bindings. Bottom 6 (btn_3 … btn_8) are per-mode — the node sends the
# active mode's labels to the webapp so the UI can relabel them dynamically.

initial_mode: gait # "gait" | "posture" | "animation"
gait_cycle: [tripod, surf, tetrapod, crawl, ripple] # fastest → slowest
default_gait: tripod
allow_unstable_gaits: true

server:
  port: 8080 # HTTP + WebSocket on the same port
  ws_heartbeat_s: 5.0 # ping each client; close it if a pong is missed
  # Second port to answer on, so http://control.hexa/ needs no port typed and
  # phone connectivity probes reach the captive-portal handling. Best-effort:
  # a privileged port needs a root container, and a refusal is logged and
  # ignored. 0 disables it.
  portal_port: 80

# If no stick/button message arrives within input_timeout_s (dropped
# WebSocket, slept phone, backgrounded tab) the node feeds neutral input so
# /cmd_vel falls to zero. Long enough to ride out jitter, short enough to stop
# promptly.
safety:
  input_timeout_s: 0.5

# Log viewer (logs page): the node runs `command` as a shell command on demand
# (GET /logs) and returns its last `lines` lines. The default concatenates the
# 20 most-recently-modified ROS log files. Robots under docker/systemd can
# override, e.g. "journalctl -u hexapod -n 200 --no-pager -o short-iso".
logs:
  lines: 400
  command: >-
    find "$HOME/.ros/log" -name '*.log' -printf '%T@ %p\n' 2>/dev/null
    | sort -rn | head -n 20 | sort -n | cut -d' ' -f2- | xargs -r cat 2>/dev/null

base:
  deadband: 0.05 # smaller than gamepad (touch input is less noisy)
  trigger_threshold: 0.5 # unused (no analog triggers) but required by BaseConfig

  # Webapp virtual key → Joy.{buttons,axes} index.
  buttons:
    btn_0: 0
    btn_1: 1
    btn_2: 2
    btn_3: 3
    btn_4: 4
    btn_5: 5
    btn_6: 6
    btn_7: 7
    btn_8: 8
  axes:
    left_stick_x: 0
    left_stick_y: 1
    right_stick_x: 2
    right_stick_y: 3
  # The JS client already sends REP-103 normalised values (forward = +1,
  # left = +1), so no sign flip is needed. Missing entries default to +1.0.
  axis_signs: {}

  # Fixed top-3 mode-select buttons.
  bindings:
    btn_0: gait_mode
    btn_1: posture_mode
    btn_2: animation_mode

gait:
  bindings:
    btn_3: init
    btn_4: record
    btn_5: gait_prev
    btn_6: gait_next
    btn_7: height_up
    btn_8: height_down
    left_stick_y: drive_x
    left_stick_x: drive_y
    right_stick_x: drive_yaw
    right_stick_y: drive_x_aux

posture:
  bindings:
    btn_3: init
    btn_4: record
    btn_5: yaw_left
    btn_6: yaw_right
    btn_7: height_up
    btn_8: height_down
    left_stick_y: pose_x
    left_stick_x: pose_y
    right_stick_x: tilt_roll
    right_stick_y: tilt_pitch

  height:
    rate_m_per_s: 0.05 # how fast btn_7/btn_8 raise/lower the body

animation:
  bindings:
    btn_3: init
    btn_4: record
    btn_5: animation_prev
    btn_6: animation_next
    btn_7: height_up
    btn_8: height_down
    left_stick_y: drive_x
    left_stick_x: drive_y
    right_stick_x: drive_yaw
    right_stick_y: drive_x_aux

# When enabled, the web node is the sole writer of /teleop/owner: it claims
# control when a webapp requests it and releases on disconnect.
arbitration:
  enabled: true
