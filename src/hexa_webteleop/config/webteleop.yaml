# Web teleop config — phone/tablet webapp (two touch joysticks + a 3x3 grid).
# There are no key bindings here: the webapp has no keys, so its grid slots
# send the function name outright (joy_mapping.BASE_FUNCTIONS |
# BUTTON_CLASS_FUNCTIONS) and the client owns which slot is which. Only the
# two sticks need a table, because which function they drive depends on the
# mode and the node is what knows the mode.

initial_mode: gait # "gait" | "posture" | "animation"
allow_unstable_gaits: true # when false, surf and crawl are skipped

# Operator presets: what the Mode view offers, and what the D-pad rotates
# through once one is in force. This is the OPERATOR half of a preset — its id,
# label, gait rotation and entry gait. The physical half — which legs it stands
# on, where those feet sit, and the stride and swing times the walk lays down —
# lives in hexa_description's tuning.yaml under the same ids, and is not
# restated here. In particular a preset's LEG SET is read from there, never
# declared here.
#
# Rotations may OVERLAP: normal, fast and offroad all stand on six legs and all
# offer the same gaits, and it is /cmd_preset that says which preset is in
# force, not the gait name. What load-time validation does require is that every
# gait in a rotation walks the legs its preset stands on, so a prev/next press
# can never ask a standing robot for a leg set the engine would refuse.
#
# Adding a preset is an edit here plus one in tuning.yaml: the active preset's
# rotation is projected onto the one gait_cycle map_joy reads, so the mapping's
# state machine never learns how many there are.
presets:
  default: normal
  # The one preset animation mode is available on. ANIM is dimmed everywhere
  # else and the node drops the press: the animations are written for the
  # six-leg stance this preset stands in, and there is nothing to be gained from
  # swinging the body around on a preset picked for speed or for clearance. The
  # Mode view greys the other presets out while the mode is in force, so the two
  # halves of the rule cannot contradict each other. Web-only, deliberately —
  # the pad has no preset control at all (see hexa_teleop's README), so the same
  # key in teleop_joy.yaml would be a dead value.
  animation: normal
  # How long the web app's Mode view waits for /gait/preset to change before
  # calling a switch refused. Comfortably over the ~2 s the change takes.
  switch_timeout_s: 4.0
  list:
    - id: normal
      label: NORMAL
      sub: six legs, everyday stance
      gait_cycle: [tripod, surf, tetrapod, crawl, ripple] # fastest → slowest
      default_gait: tripod
    - id: fast
      label: FAST
      sub: low and long-striding
      # The three stable six-leg gaits. Surf and crawl are the ones left out:
      # the preset exists for speed, and crawl on a 0.125 m stride is still
      # crawl.
      gait_cycle: [tripod, tetrapod, ripple] # fastest → slowest
      default_gait: tripod
    - id: offroad
      label: OFFROAD
      sub: tall, short steps, high clearance
      # Two gaits, at the ends of the range: ripple for the ground the preset is
      # for, tripod for getting across the easy stretch between two bits of it.
      gait_cycle: [tripod, ripple]
      # Only reached when the gait in force does not survive the switch — a
      # preset change keeps the walk where the new preset offers it.
      default_gait: tripod
    - id: quad
      label: QUAD
      sub: four corners, middle pair parked
      gait_cycle: [quad_canter, quad_walk]
      default_gait: quad_canter # what `select` stands up on

server:
  port: 8080 # HTTP + WebSocket on the same port
  ws_heartbeat_s: 5.0 # ping each client; close it if a pong is missed
  # Second port, so http://control.hexa/ needs no port typed and phone
  # connectivity probes reach the captive-portal handling. Best-effort: a
  # privileged port needs a root container, and a refusal is logged and
  # ignored. 0 disables it.
  portal_port: 80

# No stick/button message within this and the node feeds neutral input, so
# /cmd_vel falls to zero.
safety:
  input_timeout_s: 0.5

# Pack telemetry for the status strip (sensor_msgs/BatteryState, published by
# hexa_hardware on the real robot only — in sim nothing publishes it and the
# readout stays a dash). The webapp polls it over the WebSocket at
# poll_period_s; a reading older than stale_after_s reads as unknown, so a dead
# hardware node shows a dash instead of a frozen number.
telemetry:
  battery_topic: /hexa_hardware_aux/battery_state
  poll_period_s: 1.0
  stale_after_s: 5.0

# Logs page: the node runs `command` as a shell command on demand (GET /logs)
# and returns its last `lines` lines. Robots under docker/systemd can override,
# e.g. "journalctl -u hexapod -n 200 --no-pager -o short-iso".
logs:
  lines: 400
  command: >-
    find "$HOME/.ros/log" -name '*.log' -printf '%T@ %p\n' 2>/dev/null
    | sort -rn | head -n 20 | sort -n | cut -d' ' -f2- | xargs -r cat 2>/dev/null

base:
  deadband: 0.05 # smaller than gamepad (touch input is less noisy)
  trigger_threshold: 0.5 # unused (no analog triggers) but required by BaseConfig

# Which axis-class function each stick drives, per mode. The client sends the
# stick's deflection under its own name and nothing else, so a stick held
# across a mode switch changes meaning the instant the node's mode does —
# which is why this table is here and not in the webapp.
gait:
  sticks:
    left_stick_y: drive_x
    left_stick_x: drive_y
    right_stick_x: drive_yaw
    right_stick_y: drive_x_aux

posture:
  sticks:
    left_stick_y: pose_x
    left_stick_x: pose_y
    right_stick_x: tilt_roll
    right_stick_y: tilt_pitch

  height:
    rate_m_per_s: 0.05

animation:
  sticks:
    left_stick_y: drive_x
    left_stick_x: drive_y
    right_stick_x: drive_yaw
    right_stick_y: drive_x_aux

# When enabled, the web node is the sole writer of /teleop/owner: it claims
# control when a webapp requests it and releases on disconnect.
arbitration:
  enabled: true
