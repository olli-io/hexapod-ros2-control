# Servo2040 (Chica-protocol board) wiring + calibration.
#
# Servo pins 1..18 match the Servo2040 silkscreen; pin 0 is unused.
# The relay and the battery voltage/current sensors are addressed by fixed
# board-side indices in the firmware, not configured here.
# Keep each leg's three joints on consecutive pins so `write()`
# collapses to six SET frames per cycle.
#
# Per-servo endpoint pulse widths (us_at_plus_45 / us_at_minus_45) live in the
# sibling `servo_calibration.yaml`, indexed by pin (pin N → entry N-1). That
# file is the machine-writable calibration output; this file carries the
# hand-authored wiring and the fields a calibration routine never touches:
#   direction — +1 (normal) or -1 (mirror-mounted, servo turns the opposite
#               way). Optional, defaults to +1. Because the URDF keeps
#               identical joint axes for left and right legs, a physically
#               mirror-assembled servo needs -1 to realize a URDF-positive
#               command. Set per servo empirically on the real build.
#   min_us / max_us — the hard electrical clamp. Joint travel limits in radian
#               space live in geometry.yaml.
#   pin — the Servo2040 output this joint drives; also the key into
#               servo_calibration.json.
#
# The leg segment (coxa/femur/tibia) is derived from each joint's name and
# selects the matching entry in `deg_at_center`: the joint angle (degrees,
# per-joint convention from hexa_description/config/geometry.yaml) when the
# servo is at center. Defaults (0 / 35 / 68) match geometry.yaml for an ideal
# build.

connection:
  type: uart # uart | i2c | usb — factory picks the concrete Transport.
  # Host-specific OS device node. Servo2040 USB-CDC usually enumerates as
  # /dev/ttyACM0 on Linux SBCs, but the path shifts with enumeration order
  # and true-UART/I²C node names vary per board (RPi /dev/ttyAMA0, Radxa
  # /dev/ttyS2, …). For stable naming add a udev rule on USB VID/PID and
  # point this at the resulting /dev/serial/by-id/... symlink. Host pin
  # muxing belongs in the OS (device-tree overlay, /boot config), not here.
  device: /dev/ttyACM0
  baud: 115200 # ignored on Servo2040 USB-CDC; honoured for true-UART builds.

parser:
  type: servo2040 # selects the BoardProtocol (currently only servo2040).
  get_period_ticks: 10 # poll aux every Nth read() (100 Hz read → 10 Hz aux)

# The relay pin and battery-telemetry units are NOT configured here: the relay
# GPIO is owned by the Servo2040 firmware, and voltage/current arrive in fixed
# protocol units (centi-volts/amps) that the host converts with a fixed factor.
# See the servo2040 driver's protocol.md.

# Joint angle at servo center:
#   coxa  — deg from radial (0 = leg straight out from hip)
#   femur — above_horizontal_deg (positive raises the knee)
#   tibia — interior_deg (180 = fully extended)
deg_at_center:
  coxa: 0.0
  femur: 35.0
  tibia: 68.0

joints:
  # Endpoint pulse widths come from servo_calibration.yaml (by pin).
  # !IMPORTANT - pin numbers correspond to what's printed on the servo2040.
  # Left front
  l_front_coxa_joint: { pin: 1, direction: 1, min_us: 500, max_us: 2500 }
  # left side: mirror of right (foot-down = low pulse)
  l_front_femur_joint: { pin: 2, direction: -1, min_us: 500, max_us: 2500 }
  l_front_tibia_joint: { pin: 3, direction: -1, min_us: 500, max_us: 2500 }
  # Left middle
  l_middle_coxa_joint: { pin: 4, direction: 1, min_us: 500, max_us: 2500 }
  l_middle_femur_joint: { pin: 5, direction: -1, min_us: 500, max_us: 2500 }
  l_middle_tibia_joint: { pin: 6, direction: -1, min_us: 500, max_us: 2500 }
  # Left rear
  l_rear_coxa_joint: { pin: 7, direction: 1, min_us: 500, max_us: 2500 }
  l_rear_femur_joint: { pin: 8, direction: -1, min_us: 500, max_us: 2500 }
  l_rear_tibia_joint: { pin: 9, direction: -1, min_us: 500, max_us: 2500 }
  # Right front
  r_front_coxa_joint: { pin: 10, direction: 1, min_us: 500, max_us: 2500 }
  r_front_femur_joint: { pin: 11, direction: 1, min_us: 500, max_us: 2500 }
  r_front_tibia_joint: { pin: 12, direction: 1, min_us: 500, max_us: 2500 }
  # Right middle
  r_middle_coxa_joint: { pin: 13, direction: 1, min_us: 500, max_us: 2500 }
  r_middle_femur_joint: { pin: 14, direction: 1, min_us: 500, max_us: 2500 }
  r_middle_tibia_joint: { pin: 15, direction: 1, min_us: 500, max_us: 2500 }
  # Right rear
  r_rear_coxa_joint: { pin: 16, direction: 1, min_us: 500, max_us: 2500 }
  r_rear_femur_joint: { pin: 17, direction: 1, min_us: 500, max_us: 2500 }
  r_rear_tibia_joint: { pin: 18, direction: 1, min_us: 500, max_us: 2500 }
