# -- DISCLAIMER -- Bad geometry can physically damage your hexapod. Only change
# these values if you know they are sensible.
#
# Units: m, deg, kg, Nm, rad/s. Angles use each joint's own intuitive sense;
# deg→rad conversion happens at load time. Frame: REP-103.

body:
  # z=0 is the coxa rotation-axis plane; all coxas sit at this level.
  coxa_to_bottom: 0.026
  coxa_to_top: 0.02
  mass: 1.0 # sim only

leg:
  # Segment lengths, hip outward to foot tip.
  coxa_length: 0.042
  femur_length: 0.08
  tibia_length: 0.13284
  # Visual radii and masses — sim only.
  coxa_radius: 0.02
  femur_radius: 0.015
  tibia_radius: 0.0048
  coxa_mass: 0.05
  femur_mass: 0.08
  tibia_mass: 0.06

foot:
  radius: 0.0048 # ground-contact sphere
  mass: 0.01

mounts:
  # Hip mounts for the left-front and left-middle legs; symmetry fills in the
  # rest. x, y from body centre; yaw_deg counter-clockwise from forward.
  l_front: { x: 0.083, y: 0.0575, yaw_deg: 30 }
  l_middle: { x: 0.00, y: 0.082, yaw_deg: 90 }

joints:
  # Absolute travel limits, sim and real robot alike, each in its joint's own
  # intuitive sense:
  #   coxa   — fore/aft sweep about the coxa +z axis; 0 = centered.
  #   femur  — lift above horizontal; positive raises the knee.
  #   tibia  — interior knee angle; 179 = fully extended.
  # The joint angle at servo center is a property of the physical build and
  # lives in hardware.yaml's `deg_at_center`; codegen cross-checks it against
  # the window below.
  # effort and velocity are sim only (ds3235sg: 35 kg·cm and 0.13 s/60° @ 6.8V,
  # × 0.9, converted).
  coxa:
    lower_limit_deg: -65
    upper_limit_deg: 65
    effort: 3.09
    velocity: 7.25
  femur:
    lower_limit_deg: -35
    upper_limit_deg: 110
    effort: 3.09
    velocity: 7.25
  tibia:
    lower_limit_deg: 20
    upper_limit_deg: 158
    effort: 3.09
    velocity: 7.25

folded_pose:
  # Joint angles held at power-up, before any commanded motion. Also where the
  # middle pair is parked while quadruped mode walks the corners — the same
  # pose, reached and left through the same initialized_pose rung below.
  coxa:
    l_front_deg: 60 # 30° mount + 60° coxa → leg points at body-yaw 90°
    l_middle_deg: 0 # 90° mount + 0° coxa → leg points straight outward
  femur:
    above_horizontal_deg: 110 # femur tucked up
  tibia:
    interior_deg: 50 # knee folded tight

initialized_pose:
  # The rung between folded and standing.
  coxa:
    l_front_deg: 60
    l_middle_deg: 0
  femur:
    above_horizontal_deg: 90
  tibia:
    interior_deg: 70

