# Gestures: keyframed leg + body motions played from a stand on /cmd_gesture.
# Units: m, s, rad — except keys ending in `_deg`.
#
# A track is a list of keyframes. Each keyframe is one mapping whose single
# key is its type, and whose value carries `t`, the time it is reached:
# start  — legs only: when the track takes the legs over. Before it a leg
#          stands on its default position and follows the body; the ease into
#          the first pose begins here. Without one the track starts at t = 0.
#          Must come before the first pose.
# pose   — the leg poses (joint angles per leg) or the body pose (offsets from
#          the standing pose) the track reaches at t.
# oscillate — the track swings about the value before it, from that knot's
#          t to its own: each named axis moves by
#          amp * sin(360 * tau / period + lead_deg), tau the s since the knot
#          before. An envelope eases the swing in over the first `ramp` s and
#          out over the last `ramp` s, so it leaves and rejoins the value
#          before at rest. Takes `t`, `period`, `ramp` and, per leg (or for
#          the body), the axes to swing. An axis is an amplitude in its own
#          unit (`coxa_deg: 12`, `y: 0.02`) or `{ amp, lead_deg }`; axes not
#          named do not swing. Must follow a pose (or a hold of one).
# hold   — hold the track at its previous value.
# home   — the standing leg / the identity body. Every track must END on a
#          home; its t is when the track is back.
# start, hold and home take only `t`: a hold is static, a start is where the
# track begins, and a home always eases in. Every segment is smooth in
# position, velocity and acceleration.
#
# A pose also names its `transition`, how the track ARRIVES at it: `ease`
# (smoothstep, stops there) or `continuous` (a smooth curve through it).
#
# A leg pose is the leg's three joint angles, in the same intuitive sense as
# geometry.yaml's joint limits:
# coxa_deg   — fore/aft sweep about the coxa axis; 0 = centred on the mount
#              yaw, positive counter-clockwise (REP-103). Not mirrored per
#              side: a right leg swinging forward is negative.
# femur_deg  — lift above horizontal; positive raises the knee.
# tibia_deg  — interior knee angle; 179 = fully extended.
# A leg pose positions any number of legs at one t; a leg not named in it
# keeps interpolating toward its next keyframe. In place of the angles a leg
# may take one of the words `hold`, `home` or `start` (`l_front: hold`),
# with the meaning above for that leg only.
#
# A leg's `start` and `home` are the standing leg under the body pose of that
# moment, so a leg easing out of or back into its stand keeps riding the body
# track and a live /body/pose, and a home lands on the ground plane at its
# own t whatever the body is doing. Because that position is only known at
# run time, a `continuous` pose cannot directly follow a start, a home or a
# hold of one; arrive with `ease`.
# Body poses are offsets from the standing pose and must sit inside the
# posture_node pose limits; a live /body/pose adds on top of them.
#
# Each joint interpolates on its own and never leaves the range spanned by its
# neighbouring keyframes, so every pose is checked against the joint limits
# and against the ground plane, and that check covers the whole path. An
# oscillation is checked along its sampled path; a body one at its value
# before ± amp.
# Between poses a tracked leg is commanded in joint space directly: the body
# track and a live /body/pose move the body, not the leg. Whether the foot
# dips into the ground between two poses, and which legs may be in the air
# together, is the designer's responsibility.
#
# `expression` (optional) — the face hexa_display shows while the gesture
# runs: neutral, happy, sleepy, dead, greedy, woozy, angry or love. Without it
# the face keeps its normal expression.
#
# Gestures run only on the default preset (tuning.yaml default_preset); the
# standing leg there is roughly coxa as tuning.yaml splays it, femur 37,
# tibia 66.
#
# stand_step — every ease out of a leg's start lifts the foot straight up by
# `height` over the first `time` s of the segment, and every ease into a home
# ends with the foot lowered straight down over its last `time` s, so the
# joint-space ease never drags the foot along the ground. The joint-space ease
# runs alongside the last (first) `overlap` s of the step, so the foot does
# not stop at the top. The step rides the body like the stand it leaves.
# Every segment next to a start or home must be longer than `time`.
stand_step:
  height: 0.01
  time: 0.15
  overlap: 0.075
gestures:
  - id: wave
    expression: happy
    legs:
      - pose:
          t: 0.65
          transition: ease
          l_front: { coxa_deg: -17.5, femur_deg: 105, tibia_deg: 150 }
      - oscillate:
          t: 3.05
          period: 0.6
          ramp: 0.3
          l_front: { coxa_deg: 12.5 }
      - home: { t: 3.85 }
    body:
      - pose: { t: 0.65, y: -0.015, transition: ease }
      - oscillate: { t: 3.05, period: 0.6, ramp: 0.3, roll_deg: -6 }
      - home: { t: 3.85 }
  # Chitter: the body shifts back onto the rear pairs first, then both front
  # legs fold up close together in front and alternate: one lifts, sweeps in
  # and folds the knee while the other drops, sweeps out and extends, like a
  # spider working its mandibles. Coxa -40/+40 keeps the tips ~90 mm apart at
  # the crossing.
  - id: chitter
    legs:
      - start: { t: 0.4 }
      - pose:
          t: 1.0
          transition: ease
          l_front: { coxa_deg: -35, femur_deg: 77, tibia_deg: 60 }
          r_front: { coxa_deg: 35, femur_deg: 77, tibia_deg: 60 }
      - oscillate:
          t: 2.6
          period: 0.32
          ramp: 0.16
          l_front: { coxa_deg: -5, femur_deg: 2, tibia_deg: -15 }
          r_front: { coxa_deg: -5, femur_deg: -2, tibia_deg: 15 }
      - home: { t: 3.3 }
    body:
      # The small yaw twitch follows the beat.
      - pose: { t: 0.5, x: -0.05, pitch_deg: 4, transition: ease }
      - hold: { t: 1.0 }
      - oscillate: { t: 2.6, period: 0.32, ramp: 0.16, yaw_deg: -2 }
      - home: { t: 3.5 }
  - id: bow
    body:
      - pose: { t: 0.8, x: -0.03, z: -0.01, pitch_deg: 20, transition: ease }
      - hold: { t: 1.6 }
      - home: { t: 2.2 }
  # Intimidate: the weight walks back onto the middle and rear pairs, the
  # nose tips up and the front pair rises straight up, coxas splayed out to
  # 55 degrees off the body centreline. Both raised legs then wave in
  # alternation, coxa sweep plus femur nod. y and yaw share a sign so the
  # body pivots about the tail and the nose does the swinging; the roll leans
  # the raised pair against the sway to keep the CoM central. The knee curls
  # as each leg nods up and extends as it drops, like a strike. x sits at
  # posture_node's pose_limit_x; pitch 19.4 is the most the roll/pitch disc
  # clamp (pose_limit_pitch) allows with the 5 degree roll on top.
  - id: intimidate
    expression: angry
    legs:
      - start: { t: 0.5 }
      - pose:
          t: 1.2
          transition: ease
          l_front: { coxa_deg: 25, femur_deg: 90, tibia_deg: 135 }
          r_front: { coxa_deg: -25, femur_deg: 90, tibia_deg: 135 }
      - oscillate:
          t: 2.8
          period: 0.32
          ramp: 0.16
          l_front: { coxa_deg: -4, femur_deg: 3, tibia_deg: -15 }
          r_front: { coxa_deg: -4, femur_deg: -3, tibia_deg: 15 }
      - home: { t: 3.5 }
    body:
      - pose: { t: 0.5, x: -0.05, pitch_deg: -19.4, transition: ease }
      - hold: { t: 1.2 }
      - oscillate:
          { t: 2.8, period: 0.32, ramp: 0.16, y: 0.004, roll_deg: 5, yaw_deg: 2 }
      - hold: { t: 3.5 }
      - home: { t: 3.9 }
  # Boogie: the middle pair lifts, then bends to point out to the sides.
  # The body then sways side to side and the pair follows: the leg on the side
  # the body moves to reaches out while the other draws in with the knee up.
  # y and roll trace a loop: the roll runs a quarter period behind the sway
  # (y = cos, roll = -sin), so the body is level only at either side and
  # crosses the centre tilted, leaning away from the sway. The yaw twists
  # toward the side the body moves to, in step with y; the middle coxas take
  # it out so the pair stays parallel in world terms.
  # Each femur is the reach (in step with y, 25 degrees) plus the roll taken
  # out (14 degrees), one sine of 28.65 degrees 60.75 degrees ahead of the
  # roll, so the pair holds its height against the ground.
  - id: boogie
    expression: happy
    legs:
      - start: { t: 0.4 }
      - pose:
          t: 0.8
          transition: ease
          l_middle: { coxa_deg: 0, femur_deg: 80, tibia_deg: 66 }
          r_middle: { coxa_deg: 0, femur_deg: 80, tibia_deg: 66 }
      - pose:
          t: 1.3
          transition: ease
          l_middle: { coxa_deg: 0, femur_deg: 45, tibia_deg: 107.5 }
          r_middle: { coxa_deg: 0, femur_deg: 45, tibia_deg: 107.5 }
      - oscillate:
          t: 4.8
          period: 0.667
          ramp: 0.4
          l_middle:
            coxa_deg: { amp: -8, lead_deg: 90 }
            femur_deg: { amp: 28.65, lead_deg: -60.75 }
            tibia_deg: { amp: 44, lead_deg: 90 }
          r_middle:
            coxa_deg: { amp: -8, lead_deg: 90 }
            femur_deg: { amp: -28.65, lead_deg: -60.75 }
            tibia_deg: { amp: -44, lead_deg: 90 }
      - pose:
          t: 5.3
          transition: ease
          l_middle: { coxa_deg: 0, femur_deg: 20, tibia_deg: 150 }
          r_middle: { coxa_deg: 0, femur_deg: 20, tibia_deg: 150 }
      - home: { t: 6.5 }
    body:
      - hold: { t: 1.3 }
      - oscillate:
          t: 4.8
          period: 0.667
          ramp: 0.4
          y: { amp: 0.02, lead_deg: 90 }
          roll_deg: -14
          yaw_deg: { amp: 8, lead_deg: 90 }
      - home: { t: 4.9 }
  # Rave: boogie with the middle pair raised straight up.
  # The pair waves side to side with the sway: both legs lean 14 degrees
  # toward the side the body moves to (in step with y), and the femurs take
  # out the 14 degree body roll so the lean is in world terms. The two sum to
  # one sine of 19.8 degrees, 45 degrees behind the roll; femur 85 leaves
  # room under the 110 limit.
  - id: rave
    expression: angry
    legs:
      - start: { t: 0.4 }
      - pose:
          t: 1.2
          transition: ease
          l_middle: { coxa_deg: 0, femur_deg: 85, tibia_deg: 150 }
          r_middle: { coxa_deg: 0, femur_deg: 85, tibia_deg: 150 }
      - oscillate:
          t: 4.7
          period: 0.667
          ramp: 0.4
          l_middle: { femur_deg: { amp: 19.8, lead_deg: -45 } }
          r_middle: { femur_deg: { amp: -19.8, lead_deg: -45 } }
      - home: { t: 5.5 }
    body:
      - hold: { t: 1.2 }
      - oscillate:
          t: 4.7
          period: 0.667
          ramp: 0.4
          y: { amp: 0.02, lead_deg: 90 }
          roll_deg: -14
      - home: { t: 4.8 }
