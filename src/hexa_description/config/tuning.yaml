# -- WARNING -- Bad values here can damage your hexapod. Nothing validates them.
#
# Runtime gait/control/posture tuning, shared by sim, web-teleop and the Pico
# firmware. Apply: sim — `hexa sim restart`; robot — edit ~/hexa-robot/tuning.yaml
# then `hexa robot restart`; pico — reflash.
#
# Units: m, s, rad — except `_deg` names.

gait_node:
  ros__parameters:
    controller_dt: 0.005
    # cmd_vel smaller than this counts as zero.
    cmd_zero_tol: 0.02
    default_gait: tripod

    # ── Presets ──
    # A preset is the bundle the operator selects as one thing: which legs it
    # stands on, where those feet sit, and how far and how fast the walk steps.
    # `hexa_teleop`/`hexa_webteleop` carry the operator half of the same ids —
    # label, gait rotation, entry gait — and this file owns the physical half.
    #
    # leg_set — hexapod (all six) or quadruped (the four corners, middle pair
    # parked at geometry.yaml's folded_pose). Declared here, not derived from
    # the gait: two presets can offer the same gaits and differ only in stance.
    #
    # standing_pose.tip_reach — coxa axis to foot tip in the ground plane.
    # standing_pose.coxa_deg — leg rotation off-centre; positive splays feet
    # outward (rearward for the middle legs).
    #
    # Every preset carries its own stride/swing bundle; there is no global
    # fallback, so an omitted key is a load error rather than a silent
    # inheritance. A fifth preset is an edit here plus a row in the two teleop
    # configs.
    default_preset: normal

    presets:
      - id: normal
        leg_set: hexapod
        standing_pose:
          body_height: 0.06
          front:
            tip_reach: 0.135
            coxa_deg: 25
          middle:
            tip_reach: 0.135
            coxa_deg: 0
          rear:
            tip_reach: 0.135
            coxa_deg: 0
        stride_length: 0.105
        # Most a leg's own coxa-to-foot reach may close over one half stride.
        # Every direction is priced against the worst-placed leg. Set equal to
        # stride_length to disable (isotropic stride).
        stride_length_radial: 0.085
        # Airborne time per foot, fast and slow ends. Past max_swing_time the
        # robot shortens its stride instead. Keep within ~25% of each other.
        min_swing_time: 0.6
        max_swing_time: 0.8
        step_height: 0.04

      # Stands lower and reaches further, and spends the extra reach on a
      # longer stride at a quicker cadence — roughly twice normal's top speed.
      - id: fast
        leg_set: hexapod
        standing_pose:
          body_height: 0.055
          front:
            tip_reach: 0.138
            coxa_deg: 10
          middle:
            tip_reach: 0.138
            coxa_deg: 0
          rear:
            tip_reach: 0.138
            coxa_deg: 10
        stride_length: 0.125
        stride_length_radial: 0.100
        min_swing_time: 0.45
        max_swing_time: 0.60
        step_height: 0.015

      # Tall and deliberate: belly clearance for what the robot is walking
      # over, a foot that clears far more than it needs on flat ground, and a
      # short slow stride to pay for both.
      - id: offroad
        leg_set: hexapod
        standing_pose:
          body_height: 0.095
          front:
            tip_reach: 0.125
            coxa_deg: 25
          middle:
            tip_reach: 0.125
            coxa_deg: 0
          rear:
            tip_reach: 0.125
            coxa_deg: 0
        stride_length: 0.085
        stride_length_radial: 0.070
        min_swing_time: 0.75
        max_swing_time: 1.00
        step_height: 0.065

      # The four corners only. The middle pair does not stand in this preset:
      # it is held at geometry.yaml's folded_pose, so there is no middle entry
      # in its standing pose.
      - id: quad
        leg_set: quadruped
        standing_pose:
          body_height: 0.06
          front:
            tip_reach: 0.119
            coxa_deg: 25
          rear:
            tip_reach: 0.119
            coxa_deg: 25
        stride_length: 0.105
        stride_length_radial: 0.085
        min_swing_time: 0.6
        max_swing_time: 0.8
        step_height: 0.04

    # Sideways shift of the foot's arc. 0 = straight fore/aft steps.
    swing_width: 0.02

    # Descent speed at ground contact, and the probe speed below.
    touchdown_velocity: 0.015
    # Share of the swing spent in the straight probe at exactly
    # touchdown_velocity. Probe height = touchdown_velocity x fraction x
    # swing_time. Hard-capped at 0.4; 0 restores a zero-speed landing.
    touchdown_probe_fraction: 0.4

    # Share of each gait's swing window handed back to the ground at the
    # touchdown end, so legs overlap. Costs top speed.
    swing_phase_margin: 0.12
    # The same for the quadruped leg set, which buys something different with
    # it: on four feet the overlap is the window the support shift has to carry
    # the body across into the next triangle, so it is worth far more of the top
    # speed. Applied on the leg set, not the gait name — every derived velocity
    # cap keys off it too.
    quadruped_swing_phase_margin: 0.25

    # Split of an over-limit command between turning and moving. 0.5 = equal.
    yaw_bias: 0.6

    settle:
      # Wait after cmd_vel hits zero before committing to stop.
      debounce_delay: 0.4
      swing_time: 0.45

    initialize:
      # Shared by the cold start and the fold, which are time-reverses:
      # unfold_time moves all six feet between the folded and initialized poses
      # in one eased, belly-borne move; pair_swing_time is one mirrored pair's
      # swing between the initialized pose and the floor; lift_body_time is the
      # body ramp between the belly and standing height.
      unfold_time: 0.5
      pair_swing_time: 0.3
      lift_body_time: 0.5
      # Cold start only. How far above the floor the pairs park their feet, so
      # no pair carries load until all six are down and the body lift takes them
      # onto the floor together in its slow opening stretch. 0 lands each pair
      # as it swings. The fold has no counterpart: its feet leave from where
      # they were actually standing.
      place_clearance: 0.002
      swing_clearance: 0.04

    quadruped:
      # What the engagement and reseat ladders wait before lifting a corner, on
      # four feet only. The walk buys its window from quadruped_swing_phase_margin
      # above; a ladder has no phase circle to buy one from, so it holds all four
      # feet planted for this long instead while the support shift carries the
      # body into the triangle the other three make.
      #
      # The first half announces the coming lift-off through the leg's phase —
      # which is what support_shift_lead reads — and the second half is the body
      # arriving through support_shift_tau. Both halves have to be there: end it
      # at the announcement and the corner leaves under a body still in transit.
      shift_time: 1.2

    pair_fold:
      # The middle pair between the folded pose and the ground, done standing on
      # the four corners — the two halves of a leg-set change that the reseat
      # does not cover. Both directions take the same time; the unfold adds a
      # braked descent after it, whose band is derived from touchdown_velocity
      # and is not a knob. There is no clearance knob either: the folded pose's
      # femur sits on its lower joint limit, so any arc that climbs over that end
      # is unreachable, and the move is a plain eased chord by construction.
      swing_time: 0.6
      # All six feet planted for this long before the pair moves, either way. The
      # corners have just finished carrying the body across a moving support; this
      # is the beat that lets the pose smoother catch up. 0 disables.
      dwell_time: 0.15

    reseat:
      # How long a new target height must hold before re-planting.
      pose_settle_delay: 0.5
      height_change_threshold: 0.002
      pair_swing_time: 0.35
      pair_dwell_time: 0.05
      swing_clearance: 0.02
      # The body's own half of a preset change: how long it takes to ease onto
      # the new preset's body height once the ladder has the feet on the new
      # footprint. All six are planted for it, so this is one body translation
      # and not a rung at a time.
      plane_ramp_time: 0.5

control_node:
  ros__parameters:
    default_gait: "tripod"

    # Ease time from standstill to full speed and back.
    vmax_ramp_time_linear: 0.3
    vmax_ramp_time_angular: 0.3

    # Leftover speed at the end of a ramp gets snapped to zero.
    snap_tol_linear: 1.0e-4 # m/s
    snap_tol_angular: 1.0e-4 # rad/s

# Strengths and gains are dimensionless.
posture_node:
  ros__parameters:
    # Master switch for the default stack's gait-active body movement; an
    # explicitly selected animation mode is exempt. Experimental.
    gait_body_animations_enabled: false

    enabled_animations:
      - still
      - gait_sway
      - gait_bounce

    # GaitSway: shifts the body sideways to stay over the feet. gain is the
    # physical strength (1.0 = balanced); strength is a [0, 1] dial on top.
    gait_sway_gain: 1.0
    gait_sway_strength: 0.4

    #quad mode support centroid body movement tuning
    support_shift_gain: 0.45
    support_shift_lead: 0.28
    support_shift_tau: 0.14

    # Selectable in ANIMATION mode. Comma-separated entries combine several.
    animation_mode_animations:
      - vertical_body_roll
      - horizontal_body_roll
      - body_roll_3d

    # Rolls are tripod-only. phase_offset is in cycles.
    vertical_body_roll_z_amplitude: 0.02
    vertical_body_roll_pitch_amplitude_deg: 10.0
    vertical_body_roll_phase_offset: 0.0

    horizontal_body_roll_y_amplitude: 0.02
    horizontal_body_roll_yaw_amplitude_deg: 10.0
    horizontal_body_roll_phase_offset: 0.0

    # horizontal offset 0.25 = circle, 0.5 = flat line.
    body_roll_3d_z_amplitude: 0.02
    body_roll_3d_pitch_amplitude_deg: 10.0
    body_roll_3d_y_amplitude: 0.02
    body_roll_3d_yaw_amplitude_deg: 10.0
    body_roll_3d_horizontal_phase_offset: 0.25
    body_roll_3d_pitch_phase_offset: 0.0
    body_roll_3d_yaw_phase_offset: 0.0

    # GaitBounce: the body rides with the lifting feet. step_height_ref should
    # match step_height above so arc_height is a true height in metres.
    gait_bounce_arc_height: 0.1
    gait_bounce_step_height_ref: 0.08

    support_centroid_tau: 0.1
    swing_lift_tau: 0.04
    # Animation fade in/out when walking starts or stops (4.0 ≈ 0.25 s).
    gait_activation_slew_rate: 4.0

    # Spring smoother on the commanded pose, shared by all six axes. tau =
    # 1/omega_n (larger = heavier); 0 bypasses the filter entirely. Damping
    # below 1 overshoots, and on a withdrawal that overshoot is a real swing
    # past centre — exp(-pi*z/sqrt(1-z^2)) of the reach given up, so ~35% at
    # 0.32 and ~2% at 0.7.
    pose_filter_tau: 0.15
    pose_filter_damping_ratio: 0.5

    # Settle deadband on that smoother: the spring's tail is asymptotic, so
    # below this the command snaps to exactly 0 and its velocity is dropped.
    # Only fires on an arrival — an axis still moving fast (more than the
    # tolerance per tau) is left to ring, so a withdrawal keeps its swing past
    # centre. 0 disables.
    pose_filter_snap_tol_linear: 0.002 # m
    pose_filter_snap_tol_angular: 0.01 # rad

    # Posing limits. Body height is ground to underside; the other five axes are
    # symmetric (± the value). Manual pose and animation share this envelope and
    # their sum is clamped to it.
    body_height_max_m: 0.14
    body_height_min_m: 0.02
    pose_limit_x: 0.05
    pose_limit_y: 0.05
    pose_limit_roll: 0.35
    pose_limit_pitch: 0.35
    pose_limit_yaw: 0.50

# How far a stick may pose the body in posture mode.
teleop_node:
  ros__parameters:
    posture:
      x_max: 0.04
      y_max: 0.04
      roll_max_deg: 15.0
      pitch_max_deg: 15.0
      yaw_max_deg: 25.0
      # Low-pass on the eased yaw and wiggle inputs.
      yaw_tau_s: 0.10
      # Low-pass on the init-button revert to the default posture.
      revert_tau_s: 0.25
      # Point ahead of centre the wiggle swings the body about.
      wiggle_pivot_forward_m: 0.06
