# -- DISCLAIMER -- YOU CAN BREAK YOUR HEXAPOD IF THE VALUES HERE ARE NOT
# SENSIBLE OR THE JOINT PARAMETERS AND LIMIT ANGLES DO NOT MATCH YOUR
# ROBOT. THIS CODEBASE CONTAINS NO SAFEGUARDS TO VALIDATE THE
# CONFIGURATION. IT WILL RUN AND DESTROY IF THE VALUES ARE NOT SENSIBLE.

# Runtime tuning — the SINGLE SOURCE OF TRUTH for the gait, control, and
# posture feel/tuning knobs. Every value the gait_node / control_node /
# posture_node consume lives here; the packages no longer carry their own
# base YAMLs. Teleop, web-teleop, and the Pico firmware codegen read the
# same values from this file, so there is exactly one place to tune.
#
# This is a standard ROS 2 params file: each node reads its own
# `<node_name>: ros__parameters:` block. Nested maps (gait's initialize:/
# reseat:) surface as dotted parameter names (e.g. initialize.pair_swing_time).
#
# Apply after editing:
#   sim   — `hexa sim restart`   (no rebuild; symlink-install keeps this live)
#   robot — edit ~/hexa-robot/tuning.yaml, then `hexa robot restart`
#           (bind-mounted over the image copy; no rebuild)
#   pico  — needs a reflash regardless (values baked at build time)
#
# STRUCTURAL config that is NOT a feel knob stays in its owning package:
# body/leg geometry and joint limits (hexa_description geometry.yaml),
# servo tables (hexa_hardware), and joystick bindings (hexa_teleop
# teleop_joy.yaml).
#
# Units: m, s, rad — with one deliberate exception: the gait_node
# ``standing_pose`` block below is in intuitive per-joint DEGREES, so it
# reads the same way as geometry.yaml's joints: block it is validated
# against.

# ═══ Gait engine (gait_node) ════════════════════════════════════════
#
# See hexa_gait/README.md for engine behaviour — this block describes the
# knobs themselves, not how the engine consumes them. angular_z_max /
# yaw_bias are not gait-engine knobs: the velocity-caps loader
# (hexa_control, hexa_teleop, hexa_webteleop) reads them from this block;
# the gait node leaves them undeclared.
gait_node:
  ros__parameters:

    # ─── Engine basics ──────────────────────────────────────────────

    # Engine tick period (s).
    controller_dt: 0.005

    # Magnitude below which a cmd_vel component is treated as zero.
    cmd_zero_tol: 1.0e-4

    # Default gait at engine startup. Must be a key in
    # ``hexa_gait.gaits.STRATEGIES``. hexa_control seeds
    # /gait/params.gait_name from its own ``default_gait`` on cold start;
    # the teleop D-pad cycler walks through the list in ``teleop_joy.yaml``.
    # Per-gait knobs (``duty_factor``, ``unstable``) live on the strategy
    # classes in ``hexa_gait/hexa_gait/gaits/`` — the single source of
    # truth — and are read from the active strategy at runtime.
    default_gait: tripod

    # ─── Standing pose ──────────────────────────────────────────────
    #
    # Per-joint angles when the robot is at rest. The engine derives the
    # nominal foot targets (STAND footprint, reseat geometry) from these
    # via forward kinematics. Angles are in intuitive per-joint DEGREES —
    # the one exception to this file's rad convention — matching the
    # geometry.yaml joints: block they are validated against. On startup
    # ``load_standing_pose`` converts them to IK radians and checks each
    # against that joint's [lower, upper] servo window, failing fast on an
    # inconsistent edit rather than silently clipping in the URDF.
    #
    #   coxa_deg                   — rotation about the coxa-mount +z; 0
    #                                puts the leg radial at rest.
    #   femur_above_horizontal_deg — degrees the femur is lifted above
    #                                horizontal; positive raises the knee.
    #   tibia_interior_deg         — interior knee angle between femur and
    #                                tibia; 180 = fully extended.
    #
    # Default servo center and standing pose coincide on this build but
    # are kept independent so they can diverge — e.g. an asymmetric build
    # with servos biased toward one direction of travel.
    standing_pose:
      coxa_deg: 0.0                    # 0° — leg radial at rest
      femur_above_horizontal_deg: 35.0 # 35° — femur tilted above horizontal
      tibia_interior_deg: 68.0         # 68° — interior femur-tibia knee angle

    # ─── Stride geometry ────────────────────────────────────────────

    # Design per-leg stride magnitude (m): the maximum body-frame
    # displacement a foot covers between AEP and PEP in one stance.
    # Lower stride_length → tighter joint use, more headroom against
    # geometry.yaml limits, lower v_max.
    stride_length: 0.1

    # Swing-arc apex clearance (m) above the higher of origin_z / target_z.
    step_height: 0.08

    # Lateral swing offset (m). 0 keeps swings purely fore/aft.
    swing_width: 0.0

    # ─── Cycle timing ───────────────────────────────────────────────

    # Swing-phase duration bounds (s). Both anchor per-gait cycle-time
    # bounds through the same β-scaling:
    #     min_cycle_time(β) = min_swing_time / (1 − β)
    #     max_cycle_time(β) = max_swing_time / (1 − β)
    # The maximum velocity envelope is a combination of stride_length and
    # swing_time. Max_swing_time is a slow-end clamp: when swing time
    # would rise above it, velocity will start regulating via shorter
    # stride lenght.
    #
    # DUE TO HOW GAIT FOOT PLACEMENT WORKING DURING LINEAR REVERSALS OF
    # DIRECTION, THESE SHOULD BE KEPT FAIRLY CLOSE TOGETHER ( max should
    # be maximum 25% higher than min_swing_time )
    #
    # Values below anchor at tripod (β=0.5):
    # min_cycle = 0.60 s, max_cycle = 1.00 s; crawl (β=2/3) gets 0.90 /
    # 1.50 s; ripple (β=5/6) gets 1.80 / 3.00 s.
    min_swing_time: 0.30
    max_swing_time: 0.4

    # ─── Velocity envelope ──────────────────────────────────────────

    # Maximum body yaw rate (rad/s). Explicit knob (not geometry-derived):
    # the geometric ceiling from leg radii is well above what feels
    # comfortable, so this trades reach for tunable feel.
    angular_z_max: 3.00

    # Fraction of an envelope-overrun cut allocated to yaw vs translation
    # in scale_to_envelope. 0.5 cuts both equally (direction preserved);
    # >0.5 preserves more yaw at the cost of translation; 1.0 is pure
    # yaw priority. Trade-off is direction fidelity for yaw responsiveness
    # at the extremes.
    #
    # This value anchors at tripod (β=0.5). The effective per-gait bias
    # eases back toward neutral as duty factor grows:
    #     yaw_bias_eff(β) = 0.5 + (yaw_bias − 0.5) · (1.5 − β)
    # Slower gaits sit closer to neutral (crawl β=2/3 → 0.583,
    # ripple β=5/6 → 0.567) since their already-small linear_max can't
    # absorb an aggressive cut on top of the gait's intrinsic slowness.
    #
    # You may need to experiment with this a bit to find a value that feels
    # natural for you.
    yaw_bias: 0.6

    # ─── PAUSING descent ────────────────────────────────────────────

    # Upper clamp (s) on the PAUSING / disengagement descent that lowers
    # previously-airborne feet straight down to the ground. Lower bound is
    # min_swing_time; per-leg duration scales with the Z drop using the
    # fastest gait's per-leg foot-velocity ceiling
    # (stride_length / min_swing_time, derived in code — not a knob).
    max_reset_time: 1.2

    # ─── Pause state machine ────────────────────────────────────────

    # Debounce (s) on cmd_vel → 0 before the engine commits to PAUSING.
    # Wider window = fewer spurious pauses on joystick zero crossings.
    pause_debounce_delay: 0.4

    # Dwell (s) in PAUSED before the engine kicks off RESEATING back to
    # the nominal footprint.
    pause_to_reseat_delay: 0.2

    # Short PAUSED → RESEATING dwell (s) used while a gait change is
    # pending, so a mid-walk gait switch feels immediate instead of
    # waiting out the full pause_to_reseat_delay.
    gait_change_pause_to_reseat_delay: 0.1

    # ─── INITIALIZE ladder (cold start) ─────────────────────────────

    initialize:
      # Seconds per mirroring pair during PLACE_FEET. Three pairs ⇒ total
      # PLACE_FEET ≈ 3 * pair_swing_time.
      pair_swing_time: 0.4
      # Seconds for the LIFT_BODY z-ramp.
      lift_body_time: 0.6
      # Swing-arc clearance (m) added above each leg's apex during
      # PLACE_FEET. Small because the folded foot already sits well above
      # the ground.
      swing_clearance: 0.04
      # Body-frame offset (m) from the floor (with body on belly) of the
      # IK target at the end of each PLACE_FEET swing. Must clear the foot
      # collision sphere (~foot_radius below the IK target at the
      # PLACE_FEET endpose), otherwise Gazebo contact resolution lifts the
      # chassis off its belly before LIFT_BODY starts. ~foot_radius
      # (geometry.yaml foot.radius = 0.01) leaves a small real-clearance
      # margin.
      place_feet_clearance: 0.012

    # ─── RESEAT ladder ──────────────────────────────────────────────

    reseat:
      # Seconds the target pose.z must stay unchanged before the
      # STAND → RESEATING path fires after a height edit. Distinct from
      # ``pause_to_reseat_delay`` above, which gates the PAUSED → RESEATING
      # path. Bigger = less twitchy on intermediate D-pad releases.
      pose_settle_delay: 0.5
      # Dead-band (m) on |target_z − applied_z| for the STAND → RESEATING
      # trigger. Above the float-arithmetic noise on the joystick →
      # integrator → topic round-trip; tighter epsilons inside the engine
      # drive the settle timer.
      height_change_threshold: 0.002
      # Seconds per mirroring pair during the reseat swing. Matches
      # initialize.pair_swing_time so the two ladders feel visually
      # symmetric.
      pair_swing_time: 0.2
      # Seconds the ladder dwells between successive pair swings so each
      # pair visibly arrives before the next lifts off. No dwell before
      # the first pair or after the last; only between.
      pair_dwell_time: 0.05
      # Swing-arc clearance (m) above the standing footprint mid-swing.
      # Smaller than initialize.swing_clearance because feet come off a
      # planted standing pose, not from above the body.
      swing_clearance: 0.025

# ═══ Control velocity shaping (control_node) ════════════════════════
#
# See hexa_control/README.md for node behaviour and the rationale behind
# these knobs.
control_node:
  ros__parameters:
    default_gait: "tripod"

    # Seconds for the body to ramp from rest to the active gait's
    # linear_max (equivalently, from linear_max to rest, or half a full
    # reversal). Lower = snappier response, more chance of stance-foot
    # slip during reversals; higher = softer, more sluggish.
    vmax_ramp_time_linear: 0.8 # s

    # Seconds for yaw to ramp from rest to angular_max.
    vmax_ramp_time_angular: 1.0 # s

    # Sub-tick float dribble at the end of a ramp gets snapped to zero so
    # the gait engine sees an exact zero crossing (cmd_zero_tol in the
    # gait_node block above).
    snap_tol_linear: 1.0e-4 # m/s
    snap_tol_angular: 1.0e-4 # rad/s

# ═══ Posture animations (posture_node) ══════════════════════════════
#
# See hexa_posture/README.md for what each animation does — this block
# just lists the runtime knobs. Strength/gain are dimensionless.
posture_node:
  ros__parameters:
    # Animation stack composed bottom-up by the posture node. Each
    # entry must be a key in posture_node._ANIMATION_FACTORIES.
    # Order matters only for layers that aren't commutative; the
    # current set composes via pose.add and is order-invariant.
    enabled_animations:
      - still
      - gait_sway
      - gait_bounce

    # GaitSway: feedforward XY translation tracking the live
    # support-polygon centroid. Suppresses the rocking mode that
    # four-foot stances (tetrapod, crawl, surf) excite. Tripod and
    # ripple self-attenuate (their centroids sit near body origin).
    #
    # gain — physical feedforward gain. 1.0 is the sweet spot for
    # CoG-on-centroid; deviating from 1.0 trades cancellation for
    # less chassis travel.
    gait_sway_gain: 1.0
    # strength — user-facing attenuator in [0, 1]. Multiplies gain
    # before the centroid is applied. Start conservative; raise
    # toward 1.0 once the wobble suppression is dialled in.
    gait_sway_strength: 0.4

    # ANIMATION-mode animation stack. The teleop layer reads this list
    # at startup (via ``hexa_posture.load_animation_mode_animations``)
    # and cycles through it with D-up / D-down. Each name here is built
    # as a dedicated stack (just ``still`` + that animation) which
    # posture swaps in when /animation/mode carries that name.
    # Comma-separated entries compose multiple animations into a single
    # stack.
    animation_mode_animations:
      - vertical_body_roll
      - horizontal_body_roll
      - body_roll_3d

    # VerticalBodyRoll: tripod-only, phase-locked motion in the
    # vertical (sagittal) plane — body heaves up/down (z) and
    # pitches, both at cycle rate (one oscillation per gait cycle).
    vertical_body_roll_z_amplitude: 0.02
    vertical_body_roll_pitch_amplitude_deg: 10.0
    # Phase shift on the pitch sine, in cycles. Tweak if the fore/aft
    # tilt lags or leads the gait timing.
    vertical_body_roll_phase_offset: 0.0

    # HorizontalBodyRoll: tripod-only, phase-locked motion in the
    # horizontal (transverse) plane — body sways laterally (y) and
    # yaws, both at cycle rate (one oscillation per gait cycle).
    horizontal_body_roll_y_amplitude: 0.02
    horizontal_body_roll_yaw_amplitude_deg: 10.0
    horizontal_body_roll_phase_offset: 0.0

    # BodyRoll3D: tripod-only, phase-locked combination of the vertical
    # and horizontal rolls with a quarter-cycle phase offset between
    # them, so the (y, z) translation and the (pitch, yaw) rotation
    # each trace a circle once per gait cycle.
    body_roll_3d_z_amplitude: 0.02
    body_roll_3d_pitch_amplitude_deg: 10.0
    body_roll_3d_y_amplitude: 0.02
    body_roll_3d_yaw_amplitude_deg: 10.0
    # Phase shift of the horizontal pair (y, yaw) relative to the
    # vertical pair (z, pitch), in cycles. 0.25 traces a circle; 0.5
    # collapses the motion to a diagonal line.
    body_roll_3d_horizontal_phase_offset: 0.25
    body_roll_3d_pitch_phase_offset: 0.0
    body_roll_3d_yaw_phase_offset: 0.0

    # GaitBounce: gait-synced vertical lift. Tracks the max foot
    # swing lift across all legs so the body rides up with the
    # swinging feet — body is at rest when a leg lands (AEP), at
    # peak when the highest swinging foot is at its swing apex.
    # For crawl/surf the max picks whichever airborne leg is
    # closest to its apex, so the bounce follows the main wave and
    # ignores the half-phase overlap.
    #
    # arc_height — max body lift (m) at swing apex. Body Z spans
    # [0, arc_height] over the gait cycle. Composes additively with
    # other Z animations (Breathing) and the user pose; keep
    # conservative so it stays inside the PoseLimits.z envelope.
    gait_bounce_arc_height: 0.02
    # step_height_ref — reference foot swing apex (m) used to
    # normalise the lift signal. Mirrors the gait_node ``step_height``
    # above so arc_height represents the actual peak body lift in
    # metres; keep the two equal.
    gait_bounce_step_height_ref: 0.08

    # Time constant (s) for the first-order low-pass on the support
    # centroid. Smooths out the step at swing-pair handover so the
    # sway itself doesn't re-excite the rocking mode.
    support_centroid_tau: 0.1

    # Time constant (s) for the first-order low-pass on the swing
    # lift signal driving GaitBounce. Rounds off the slope kink at
    # leg handover in overlapping gaits (crawl, surf) where the
    # max-across-legs switches between two arcs. Keep small (a few
    # percent of the typical sub-cycle period) so the body bounce
    # doesn't visibly lag the feet.
    swing_lift_tau: 0.04

