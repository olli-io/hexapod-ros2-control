# -- WARNING -- Bad values here can damage your hexapod. Nothing in this
# codebase validates them: it will run whatever you put here. Make sure the
# angles and limits match your actual robot.

# Runtime tuning — the single place to tune gait, control, and posture feel.
# Sim, web-teleop, and the Pico firmware all read these same values.
#
# Standard ROS 2 params file: each node reads its own
# `<node_name>: ros__parameters:` block.
#
# Apply after editing:
#   sim   — `hexa sim restart`  (no rebuild)
#   robot — edit ~/hexa-robot/tuning.yaml, then `hexa robot restart`
#   pico  — reflash (values are baked in at build time)
#
# Geometry, joint limits, servo tables, and joystick bindings live in their
# own packages, not here.
#
# Units: metres, seconds, radians — except the standing_pose block below,
# which is in degrees for readability.

# ═══ Gait engine (gait_node) ════════════════════════════════════════
gait_node:
  ros__parameters:
    # ─── Engine basics ──────────────────────────────────────────────

    # Engine tick period (s).
    controller_dt: 0.005

    # cmd_vel smaller than this counts as zero.
    cmd_zero_tol: 0.02

    # Gait used at startup. The teleop D-pad cycles through the rest.
    default_gait: tripod

    # ─── Standing pose ──────────────────────────────────────────────
    #
    # Resting angle of each joint, in DEGREES. The engine works out the
    # nominal foot positions from these. Checked against the joint limits
    # at startup, so a bad edit fails fast instead of straining a servo.
    #
    #   coxa_deg                   — leg swivel; 0 points the leg straight out.
    #   femur_above_horizontal_deg — how far the thigh is lifted; higher = knee up.
    #   tibia_interior_deg         — knee bend; 180 = leg fully straight.
    standing_pose:
      coxa_deg: 0.0
      femur_above_horizontal_deg: 40.0
      tibia_interior_deg: 69.7

    # ─── Stride geometry ────────────────────────────────────────────

    # How far a foot travels along the ground in one step (m).
    # Shorter = gentler on the joints, but slower top speed.
    stride_length: 0.09

    # How high a foot lifts during a step (m).
    step_height: 0.06

    # Sideways shift of the foot's arc (m). 0 = straight fore/aft steps.
    swing_width: 0.02

    # Share of the airborne time spent rising to the top of the arc.
    # 0.5 splits the step evenly. Lower values hand the descent more of the
    # swing, so the foot settles onto the ground more gently for the same
    # step height — at the cost of an equally steeper climb off it. 0.5 is
    # the point where neither end is working harder than the other; move it
    # down only if the feet still land harder than they lift.
    #
    # The foot is never allowed to scrub either way: it leaves and meets the
    # ground travelling at exactly ground speed whatever this is set to.
    # That comes from the shape of the swing curve, not from a tuning value.
    swing_apex_fraction: 0.5

    # How fast the foot is still descending as it meets the ground (m/s).
    # 0 eases it to a dead stop exactly at ground level, which is smoothest
    # on perfectly flat ground but lands hard whenever the ground or the
    # servo tracking is off by a millimetre or two. A small value makes
    # contact happen at this speed instead, whenever it happens: the last
    # stretch of the descent is a steady, slow probe at this speed rather
    # than a curve still braking as it arrives.
    touchdown_velocity: 0.01

    # ─── Cycle timing ───────────────────────────────────────────────

    # How long a single foot spends in the air (s), fast and slow ends.
    # Together with stride_length these set the top speed: once a foot
    # would move slower than max_swing_time allows, the robot shortens
    # its stride instead.
    #
    # Keep these close together (max no more than ~25% above min), or
    # foot placement can misbehaves when reversing direction.
    min_swing_time: 0.6
    max_swing_time: 0.8

    # Share of each gait's airborne window handed back to the ground, taken
    # at the touchdown end. It makes every leg land a little before the leg
    # it is handing over to lifts off, so there is always a stretch with all
    # six feet planted instead of a knife-edge swap that timing jitter can
    # turn into too few legs on the ground.
    #
    # As a share of the window rather than of the whole cycle, it buys the
    # same overlap *time* in every gait. 0.12 gives a tripod 6% of its cycle
    # with six feet down at each handover. It costs top speed: the feet
    # spend longer planted, so the same stride takes longer to cover.
    swing_phase_margin: 0.12

    # ─── Velocity envelope ──────────────────────────────────────────

    # Top turning speed (rad/s). The legs could turn faster; this caps it
    # to what feels comfortable.
    angular_z_max: 2.50

    # When a command exceeds what the robot can do, how much of the cut
    # falls on turning vs. moving. 0.5 = share equally; higher = protect
    # turn responsiveness at the cost of straight-line accuracy.
    # Expect to experiment to find what feels right.
    yaw_bias: 0.6

    # ─── Pausing descent ────────────────────────────────────────────

    # Longest time (s) allowed to lower airborne feet to the ground when
    # coming to a stop.
    max_reset_time: 1.2

    # ─── Pause state machine ────────────────────────────────────────

    # Wait (s) after cmd_vel hits zero before actually pausing.
    # Longer = fewer accidental pauses when the joystick crosses zero.
    pause_debounce_delay: 0.4

    # Wait (s) while paused before the feet return to the resting stance.
    pause_to_reseat_delay: 0.2

    # Shorter version of the above used when a gait change is pending, so
    # switching gait mid-walk feels immediate.
    gait_change_pause_to_reseat_delay: 0.1

    # ─── Cold-start sequence ────────────────────────────────────────

    initialize:
      # Time (s) to place each mirrored pair of feet (three pairs total).
      pair_swing_time: 0.35
      # Time (s) to raise the body off its belly.
      lift_body_time: 0.8
      # Extra foot lift (m) while placing feet. Small — the folded foot
      # already starts high.
      swing_clearance: 0.04
      # How high off the floor (m) each foot lands when placed. Must clear
      # the foot's collision sphere, or Gazebo shoves the body up early.
      place_feet_clearance: 0.012

    # ─── Return-to-stance sequence ──────────────────────────────────

    reseat:
      # How long (s) the target height must hold steady before the feet
      # re-plant after a height change. Bigger = less twitchy.
      pose_settle_delay: 0.5
      # Height change (m) small enough to ignore, so joystick noise
      # doesn't trigger a re-plant.
      height_change_threshold: 0.002
      # Time (s) to swing each mirrored pair of feet into place.
      pair_swing_time: 0.3
      # Pause (s) between pairs so each one lands before the next lifts.
      pair_dwell_time: 0.05
      # Extra foot lift (m) mid-swing. Small — feet start from the ground.
      swing_clearance: 0.025

# ═══ Control velocity shaping (control_node) ════════════════════════
control_node:
  ros__parameters:
    default_gait: "tripod"

    # Time (s) to ease from a standstill up to full forward speed (and
    # back down). Lower = snappier but more foot slip on reversals.
    vmax_ramp_time_linear: 0.8 # s

    # Time (s) to ease up to full turning speed.
    vmax_ramp_time_angular: 1.0 # s

    # Tiny leftover speed at the end of a ramp gets snapped to zero.
    snap_tol_linear: 1.0e-4 # m/s
    snap_tol_angular: 1.0e-4 # rad/s

# ═══ Posture animations (posture_node) ══════════════════════════════
#
# Body-movement layers that run on top of walking. Strengths and gains
# are dimensionless.
posture_node:
  ros__parameters:
    # Master switch for body movement while gait-active. Gait body animations are an experimental feature and may require extensive tinkering.
    gait_body_animations_enabled: false

    # Animations that run while walking. Each must be a known animation name.
    enabled_animations:
      - still
      - gait_sway
      - gait_bounce

    # GaitSway: shifts the body sideways to stay balanced over the feet,
    # cancelling the rocking that four-footed gaits (tetrapod, crawl,
    # surf) produce. Tripod and ripple barely need it.
    #
    # gain — physical strength of the effect; 1.0 is the balanced sweet spot.
    gait_sway_gain: 1.0
    # strength — overall dial in [0, 1] on top of gain. Start low, raise
    # toward 1.0 as you tune out the wobble.
    gait_sway_strength: 0.4

    # Animations selectable in ANIMATION mode, cycled with D-up / D-down.
    # Comma-separated entries combine several into one.
    animation_mode_animations:
      - vertical_body_roll
      - horizontal_body_roll
      - body_roll_3d

    # VerticalBodyRoll (tripod only): body bobs up/down and tilts
    # fore/aft, once per gait cycle.
    vertical_body_roll_z_amplitude: 0.02
    vertical_body_roll_pitch_amplitude_deg: 10.0
    # Timing shift of the tilt relative to the bob, in cycles.
    vertical_body_roll_phase_offset: 0.0

    # HorizontalBodyRoll (tripod only): body sways side to side and turns
    # left/right, once per gait cycle.
    horizontal_body_roll_y_amplitude: 0.02
    horizontal_body_roll_yaw_amplitude_deg: 10.0
    horizontal_body_roll_phase_offset: 0.0

    # BodyRoll3D (tripod only): the vertical and horizontal rolls combined
    # so the body traces a circle once per gait cycle.
    body_roll_3d_z_amplitude: 0.02
    body_roll_3d_pitch_amplitude_deg: 10.0
    body_roll_3d_y_amplitude: 0.02
    body_roll_3d_yaw_amplitude_deg: 10.0
    # Offset between the two rolls, in cycles. 0.25 = circle; 0.5 = flat line.
    body_roll_3d_horizontal_phase_offset: 0.25
    body_roll_3d_pitch_phase_offset: 0.0
    body_roll_3d_yaw_phase_offset: 0.0

    # GaitBounce: body rides up and down with the lifting feet — lowest
    # as a foot lands, highest when a foot is at the top of its step.
    #
    # arc_height — how far the body lifts (m). Keep it small so it stays
    # within the allowed body-movement range.
    gait_bounce_arc_height: 0.1
    # step_height_ref — should match step_height above so arc_height is a
    # true height in metres.
    gait_bounce_step_height_ref: 0.08

    # Smoothing (s) on the sway, so the handover between foot pairs doesn't
    # re-introduce the rocking.
    support_centroid_tau: 0.1

    # Smoothing (s) on the bounce, to round off the kink when the highest
    # foot changes in overlapping gaits. Keep small so the body doesn't
    # visibly lag the feet.
    swing_lift_tau: 0.04

    # How quickly animations fade in/out when walking starts or stops
    # (higher = faster; 4.0 ≈ 0.25 s), so the body doesn't jump.
    gait_activation_slew_rate: 4.0

    # Movement range (m / rad) set aside for the animation layer so a
    # dialed-in body pose can't crowd it out and cause jitter. The trade-off
    # is a slightly smaller manual posing range. Size these to cover the
    # animation amplitudes above.
    animation_reserve_x: 0.02
    animation_reserve_y: 0.02
    animation_reserve_z: 0.03
    animation_reserve_roll: 0.20
    animation_reserve_pitch: 0.20
    animation_reserve_yaw: 0.20

# -- WARNING -- Bad values here can damage your hexapod. Nothing validates
# them: it will run whatever you put here.
