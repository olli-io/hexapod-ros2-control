# -- WARNING -- Bad values here can damage your hexapod. Nothing in this
# codebase validates them: it will run whatever you put here. Make sure the
# angles and limits match your actual robot.

# Runtime tuning — the single place to tune gait, control, and posture feel.
# Sim, web-teleop, and the Pico firmware all read these same values.
#
# Standard ROS 2 params file: each node reads its own
# `<node_name>: ros__parameters:` block.
#
# Apply after editing:
#   sim   — `hexa sim restart`  (no rebuild)
#   robot — edit ~/hexa-robot/tuning.yaml, then `hexa robot restart`
#   pico  — reflash (values are baked in at build time)
#
# Geometry, joint limits, servo tables, and joystick bindings live in their
# own packages, not here.
#
# Units: metres, seconds, radians — except values whose name ends in `_deg`,
# which are in degrees for readability.

# ═══ Gait engine (gait_node) ════════════════════════════════════════
gait_node:
  ros__parameters:
    # ─── Engine basics ──────────────────────────────────────────────

    # Engine tick period (s).
    controller_dt: 0.005

    # cmd_vel smaller than this counts as zero.
    cmd_zero_tol: 0.02

    # Gait used at startup. The teleop D-pad cycles through the rest.
    default_gait: tripod

    # ─── Default standing pose ──────────────────────────────────────
    #
    # Where the feet sit at rest — the pose the robot stands in and the one
    # body posing moves away from. The engine solves the femur and tibia
    # angles from these and checks them against the joint limits when the
    # config loads, so a bad edit fails fast instead of straining a servo.
    #
    #   body_height — belly clearance off the ground (m). One value: the body
    #                 has one height, and the posture stack's own limits are
    #                 measured against it.
    #
    # The front, middle and rear pairs are configured separately; left and
    # right always mirror each other. Each pair takes:
    #
    #   tip_reach — distance from the leg's coxa rotation axis (its body
    #               attachment point) to the foot tip, measured in the ground
    #               plane only (m). Because it starts at the coxa axis rather
    #               than the body centre, changing coxa_deg swings the leg
    #               without changing this. Bigger = wider stance, more reach,
    #               more torque on the servos.
    #   coxa_deg  — how far the legs rotates off-center, in degrees.
    #               Positive splays the feet outward, away from the body's
    #               fore/aft centreline and towards the middle legs. For the
    #               middle legs, positive angle rotates the leg toward the rear.
    default_standing_pose:
      body_height: 0.06
      front:
        tip_reach: 0.135
        coxa_deg: 15
      middle:
        tip_reach: 0.135
        coxa_deg: 0
      rear:
        tip_reach: 0.135
        coxa_deg: 0

    # ─── Stride geometry ────────────────────────────────────────────

    # How far a foot travels along the ground in one step (m).
    # Shorter = gentler on the joints, but slower top speed.
    stride_length: 0.1

    # How high a foot lifts during a step (m).
    step_height: 0.04

    # Sideways shift of the foot's arc (m). 0 = straight fore/aft steps.
    swing_width: 0.02

    # Share of the airborne time spent rising to the top of the arc.
    # 0.5 splits the step evenly.
    #
    # Keep this near the middle. It is tempting to lower it to buy a gentler
    # landing, but the foot's forward travel is spread over the whole swing
    # while its height is not: drop this and the foot tops out early and then
    # sweeps most of the way to its touchdown point at low altitude, where it
    # can catch on anything the step was meant to clear. The foot should come
    # down onto the target from above, not slide in towards it.
    #
    # The gentle landing is bought by touchdown_velocity and
    # touchdown_probe_height instead, which cost no altitude.
    #
    # The foot is never allowed to scrub either way: it leaves and meets the
    # ground travelling at exactly ground speed whatever this is set to.
    # That comes from the shape of the swing curve, not from a tuning value.
    swing_apex_fraction: 0.3

    # How fast the foot is still descending as it meets the ground (m/s),
    # and the speed of the probe below.
    #
    # Do not set this too low. Two reasons, both counter-intuitive. It sets
    # how long the probe lasts (probe height divided by this speed), so a
    # slow probe is a long one, and a long one stops being a drop onto the
    # target and becomes a low sweep towards it. And at 200 Hz a speed this
    # small moves the foot less than one servo step per tick, so the descent
    # the servos actually perform is a staircase rather than the slow, steady
    # approach asked for.
    touchdown_velocity: 0.05

    # How far above the ground the descent stops braking and becomes a
    # straight line at exactly touchdown_velocity (m).
    #
    # This is the knob that matters on real servos. A curve that only
    # *approaches* touchdown_velocity reaches it in the limit at ground
    # level and nowhere else: half a millimetre up it is still coming down
    # many times faster. Since the servos can only resolve the foot's height
    # to a couple of tenths of a millimetre, contact in practice always
    # happens early, up on the fast part of the curve, and the leg lands hard
    # and takes the body's weight with a jolt. That is the forward jerk felt
    # at each handover.
    #
    # A straight final segment lands at the same gentle speed anywhere
    # inside its height, so this wants to be comfortably larger than the
    # servos' resolution and than the height error between legs. Raising it
    # buys tolerance about *when* contact happens; the costs are that a foot
    # meeting the ground at the top of the band is then pressed this far into
    # it before the swing ends, and that the probe lasts proportionally
    # longer (see touchdown_velocity). 2–3 mm is a good starting point.
    # 0 restores the plain braked descent.
    touchdown_probe_height: 0.0025

    # How fast the foot leaves the ground at the start of a step (m/s).
    # The mirror of touchdown_velocity. 0 peels the foot off with zero
    # initial speed, which leaves it creeping through the first fraction of
    # a millimetre — inside a single servo step — while the leg is still
    # carrying weight, so the handover of load smears out and lands where
    # the quantisation happens to put it. A non-zero value breaks contact at
    # a definite speed instead. Nothing is touching the ground afterwards,
    # so there is nothing for a brisk lift to jar against.
    #
    # As with touchdown_velocity, worth keeping above one servo step per
    # 200 Hz tick so the break from the ground is a move rather than a
    # rounding error.
    liftoff_velocity: 0.3

    # ─── Cycle timing ───────────────────────────────────────────────

    # How long a single foot spends in the air (s), fast and slow ends.
    # Together with stride_length these set the top speed: once a foot
    # would move slower than max_swing_time allows, the robot shortens
    # its stride instead.
    #
    # Keep these close together (max no more than ~25% above min), or
    # foot placement can misbehaves when reversing direction.
    min_swing_time: 0.5
    max_swing_time: 0.6

    # Share of each gait's airborne window handed back to the ground, taken
    # at the touchdown end. It makes every leg land a little before the leg
    # it is handing over to lifts off, so there is always a stretch with all
    # six feet planted instead of a knife-edge swap that timing jitter can
    # turn into too few legs on the ground.
    #
    # As a share of the window rather than of the whole cycle, it buys the
    # same overlap *time* in every gait. 0.12 gives a tripod 6% of its cycle
    # with six feet down at each handover. It costs top speed: the feet
    # spend longer planted, so the same stride takes longer to cover.
    swing_phase_margin: 0.12

    # ─── Velocity envelope ──────────────────────────────────────────

    # When a command exceeds what the robot can do, how much of the cut
    # falls on turning vs. moving. 0.5 = share equally; higher = protect
    # turn responsiveness at the cost of straight-line accuracy.
    # Expect to experiment to find what feels right.
    yaw_bias: 0.6

    # ─── Settling to a stop ─────────────────────────────────────────
    #
    # When the command goes to zero the gait keeps running with a zero
    # stride, so every foot's touchdown point collapses onto its resting
    # stance: the walk re-plants its own feet, and the robot stands the
    # moment the last one lands. A tripod stops this way in one cycle.
    #
    # Gaits that swing their legs in smaller groups are slower at it, and
    # a crawl — whose swings run end to end, so all six feet are never
    # down together — cannot finish this way at all. Those stop lifting
    # new legs, land whatever is in the air, and hand the rest to the
    # reseat ladder below. The engine picks whichever is quicker, so
    # retuning either side moves the line on its own.

    settle:
      # Wait (s) after cmd_vel hits zero before the gait commits to
      # stopping. Longer = fewer accidental stops when the stick crosses
      # zero.
      debounce_delay: 0.4
      # Time (s) a foot spends in the air while settling, which sets the
      # settle's cycle time — and with it the worst-case stop, one cycle.
      # Divided by the gait's swing window the same way min/max_swing_time
      # are, so every gait gets the same airborne time.
      #
      # A settling step covers at most half a stride, half of what a
      # walking step does, so it can be quicker than min_swing_time
      # without the foot moving any faster horizontally. It lifts the foot
      # exactly as high, though, so the margin here is only as wide as
      # swing_apex_fraction leaves the climb: shorten either and a stop
      # starts out-accelerating a walk vertically, which it must not.
      swing_time: 0.45

    # ─── Cold-start sequence ────────────────────────────────────────

    initialize:
      # Time (s) to place each mirrored pair of feet (three pairs total).
      pair_swing_time: 0.3
      # Time (s) to raise the body off its belly.
      lift_body_time: 0.5
      # Extra foot lift (m) while placing feet. Small — the folded foot
      # already starts high.
      swing_clearance: 0.04
      # How high off the floor (m) each foot lands when placed. Must clear
      # the foot's collision sphere, or Gazebo shoves the body up early.
      place_feet_clearance: 0.012

    # ─── Return-to-stance ladder ────────────────────────────────────
    #
    # Places the feet in three mirrored pairs, skipping any that are
    # already standing where they are being sent. Used after a body
    # height change, and by the gaits above that cannot settle
    # themselves.

    reseat:
      # How long (s) the target height must hold steady before the feet
      # re-plant after a height change. Bigger = less twitchy.
      pose_settle_delay: 0.5
      # Height change (m) small enough to ignore, so joystick noise
      # doesn't trigger a re-plant.
      height_change_threshold: 0.002
      # Time (s) to swing each mirrored pair of feet into place.
      pair_swing_time: 0.35
      # Pause (s) between pairs so each one lands before the next lifts.
      pair_dwell_time: 0.05
      # Extra foot lift (m) mid-swing. Small — feet start from the ground.
      swing_clearance: 0.02

# ═══ Control velocity shaping (control_node) ════════════════════════
control_node:
  ros__parameters:
    default_gait: "tripod"

    # Time (s) to ease from a standstill up to full forward speed (and
    # back down). Lower = snappier but more foot slip on reversals.
    vmax_ramp_time_linear: 0.8 # s

    # Time (s) to ease up to full turning speed.
    vmax_ramp_time_angular: 1.0 # s

    # Tiny leftover speed at the end of a ramp gets snapped to zero.
    snap_tol_linear: 1.0e-4 # m/s
    snap_tol_angular: 1.0e-4 # rad/s

# ═══ Posture animations (posture_node) ══════════════════════════════
#
# Body-movement layers that run on top of walking. Strengths and gains
# are dimensionless.
posture_node:
  ros__parameters:
    # Master switch for the default stack's body movement while gait-active
    # (gait_sway, gait_bounce). An explicitly selected animation mode is exempt
    # and always runs. Gait body animations are an experimental feature and may
    # require extensive tinkering.
    gait_body_animations_enabled: false

    # Animations that run while walking. Each must be a known animation name.
    enabled_animations:
      - still
      - gait_sway
      - gait_bounce

    # GaitSway: shifts the body sideways to stay balanced over the feet,
    # cancelling the rocking that four-footed gaits (tetrapod, crawl,
    # surf) produce. Tripod and ripple barely need it.
    #
    # gain — physical strength of the effect; 1.0 is the balanced sweet spot.
    gait_sway_gain: 1.0
    # strength — overall dial in [0, 1] on top of gain. Start low, raise
    # toward 1.0 as you tune out the wobble.
    gait_sway_strength: 0.4

    # Animations selectable in ANIMATION mode, cycled with D-up / D-down.
    # Comma-separated entries combine several into one.
    animation_mode_animations:
      - vertical_body_roll
      - horizontal_body_roll
      - body_roll_3d

    # VerticalBodyRoll (tripod only): body bobs up/down and tilts
    # fore/aft, once per gait cycle.
    vertical_body_roll_z_amplitude: 0.02
    vertical_body_roll_pitch_amplitude_deg: 10.0
    # Timing shift of the tilt relative to the bob, in cycles.
    vertical_body_roll_phase_offset: 0.0

    # HorizontalBodyRoll (tripod only): body sways side to side and turns
    # left/right, once per gait cycle.
    horizontal_body_roll_y_amplitude: 0.02
    horizontal_body_roll_yaw_amplitude_deg: 10.0
    horizontal_body_roll_phase_offset: 0.0

    # BodyRoll3D (tripod only): the vertical and horizontal rolls combined
    # so the body traces a circle once per gait cycle.
    body_roll_3d_z_amplitude: 0.02
    body_roll_3d_pitch_amplitude_deg: 10.0
    body_roll_3d_y_amplitude: 0.02
    body_roll_3d_yaw_amplitude_deg: 10.0
    # Offset between the two rolls, in cycles. 0.25 = circle; 0.5 = flat line.
    body_roll_3d_horizontal_phase_offset: 0.25
    body_roll_3d_pitch_phase_offset: 0.0
    body_roll_3d_yaw_phase_offset: 0.0

    # GaitBounce: body rides up and down with the lifting feet — lowest
    # as a foot lands, highest when a foot is at the top of its step.
    #
    # arc_height — how far the body lifts (m). Keep it small so it stays
    # within the allowed body-movement range.
    gait_bounce_arc_height: 0.1
    # step_height_ref — should match step_height above so arc_height is a
    # true height in metres.
    gait_bounce_step_height_ref: 0.08

    # Smoothing (s) on the sway, so the handover between foot pairs doesn't
    # re-introduce the rocking.
    support_centroid_tau: 0.1

    # Smoothing (s) on the bounce, to round off the kink when the highest
    # foot changes in overlapping gaits. Keep small so the body doesn't
    # visibly lag the feet.
    swing_lift_tau: 0.04

    # How quickly animations fade in/out when walking starts or stops
    # (higher = faster; 4.0 ≈ 0.25 s), so the body doesn't jump.
    gait_activation_slew_rate: 4.0

    # Spring/inertia smoother on the commanded pose, so a stepped /body/pose
    # ramps instead of snapping. tau is 1/omega_n in seconds (larger = heavier);
    # damping_ratio below 1 overshoots. 0.135 / 0.32 gives ~35% overshoot
    # settling in ~0.4 s. A tau of 0 bypasses that group.
    pose_filter_tau_translation: 0.135
    pose_filter_tau_rotation: 0.135
    pose_filter_damping_ratio: 0.32

    # Movement range (m / rad) set aside for the animation layer so a
    # dialed-in body pose can't crowd it out and cause jitter. The trade-off
    # is a slightly smaller manual posing range. Size these to cover the
    # animation amplitudes above.
    animation_reserve_x: 0.01
    animation_reserve_y: 0.01
    animation_reserve_z: 0
    animation_reserve_roll: 0.15
    animation_reserve_pitch: 0.15
    animation_reserve_yaw: 0.15

    # How far the body may be posed away from its resting stance (measured from ground to the bottom of the hexa).
    body_height_max_m: 0.14
    body_height_min_m: 0.02

    # The remaining five axes are symmetric (plus/minus the value given).
    # Metres for x/y, radians for roll/pitch/yaw.
    pose_limit_x: 0.05
    pose_limit_y: 0.05
    pose_limit_roll: 0.30
    pose_limit_pitch: 0.30
    pose_limit_yaw: 0.50

# -- WARNING -- Bad values here can damage your hexapod. Nothing validates
# them: it will run whatever you put here.
