# ros2_control controller manager + controller config for the simulated hexapod.
#
# Loaded by the gz_ros2_control-system plugin (declared in
# hexa_description/urdf/hexapod.gazebo.xacro) when use_sim:=true. hexa_bringup
# has its own copy for the real robot.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # All 18 joints in one group; takes a std_msgs/Float64MultiArray on
    # /joint_group_position_controller/commands in the order listed below.
    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

joint_group_position_controller:
  ros__parameters:
    joints:
      - l_front_coxa_joint
      - l_front_femur_joint
      - l_front_tibia_joint
      - l_middle_coxa_joint
      - l_middle_femur_joint
      - l_middle_tibia_joint
      - l_rear_coxa_joint
      - l_rear_femur_joint
      - l_rear_tibia_joint
      - r_front_coxa_joint
      - r_front_femur_joint
      - r_front_tibia_joint
      - r_middle_coxa_joint
      - r_middle_femur_joint
      - r_middle_tibia_joint
      - r_rear_coxa_joint
      - r_rear_femur_joint
      - r_rear_tibia_joint
