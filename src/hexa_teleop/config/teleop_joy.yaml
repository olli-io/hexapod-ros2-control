# Joystick teleop config — X-input controller (Xbox, 8BitDo, etc.).
# Keys bind to function names (see joy_mapping.ALL_FUNCTIONS); "" is unbound.

initial_mode: gait # gait | posture | animation
gait_cycle: [tripod, surf, tetrapod, crawl, ripple] # fastest → slowest
default_gait: tripod
allow_unstable_gaits: true # when false, surf and crawl are skipped

base:
  deadband: 0.1
  trigger_threshold: 0.5 # analog triggers as binary; press = axis < this

  # sensor_msgs/Joy indices — edit to support a different controller.
  buttons:
    a: 0
    b: 1
    x: 2
    y: 3
    l1: 4
    r1: 5
    select: 6
    start: 7
  axes:
    left_stick_x: 0
    left_stick_y: 1
    l2: 2 # analog trigger, rest=+1.0 pressed=-1.0
    right_stick_x: 3
    right_stick_y: 4
    r2: 5
    dpad_x: 6
    dpad_y: 7

  # Per-axis sign; missing entries default to +1.0.
  # After signs: forward → +1, left → +1, dpad-up/right → +1 (REP-103).
  axis_signs:
    left_stick_x: -1.0
    left_stick_y: -1.0
    right_stick_x: -1.0
    right_stick_y: -1.0
    dpad_x: 1.0
    dpad_y: 1.0

  # Mode-agnostic: gait_mode | posture_mode | animation_mode | init | record
  bindings:
    a: gait_mode
    b: animation_mode
    x: ""
    y: posture_mode
    start: init
    select: record

gait:
  bindings:
    l1: yaw_left
    r1: yaw_right
    l2: wiggle_left
    r2: wiggle_right
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    # Stand up in quadruped mode: the middle pair stays folded and the
    # four corners creep one leg at a time. The select half of the init
    # button — `start` stands the robot up on six legs, this on four, and
    # off the belly either one folds it. Bound here only, so it does
    # nothing in the other two modes, where `select` keeps its base
    # binding (`record`, itself inert outside posture mode).
    select: quadruped_mode
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

posture:
  bindings:
    l1: yaw_left
    r1: yaw_right
    l2: wiggle_left
    r2: wiggle_right
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    left_stick_x: tilt_roll
    left_stick_y: tilt_pitch
    right_stick_x: pose_y
    right_stick_y: pose_x

  height:
    rate_m_per_s: 0.05

animation:
  bindings:
    l1: ""
    r1: ""
    l2: ""
    r2: ""
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: animation_prev
    dpad_right: animation_next
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

# When enabled, the gamepad publishes only while it owns /teleop/owner
# (default owner "gamepad"). Disable for standalone gamepad.
arbitration:
  enabled: true
