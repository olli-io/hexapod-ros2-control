# Joystick teleop config — X-input controller (Xbox, 8BitDo, etc.).
# Keys bind to function names (see joy_mapping.ALL_FUNCTIONS); "" is unbound.
# Hardware identity (indices, signs, threshold) lives in ``base`` only.

initial_mode: gait # gait | posture | animation
gait_cycle: [tripod, surf, tetrapod, crawl, ripple] # fastest → slowest
default_gait: tripod
allow_unstable_gaits: true # when false, surf and crawl are skipped

base:
  deadband: 0.1
  trigger_threshold: 0.5 # analog triggers as binary; press = axis < this

  # sensor_msgs/Joy indices — edit to support a different controller.
  buttons:
    a: 0
    b: 1
    x: 2
    y: 3
    l1: 4
    r1: 5
    select: 6
    start: 7
  axes:
    left_stick_x: 0
    left_stick_y: 1
    l2: 2 # analog trigger (rest=+1.0, pressed=-1.0)
    right_stick_x: 3
    right_stick_y: 4
    r2: 5
    dpad_x: 6
    dpad_y: 7

  # Per-axis sign; missing entries default to +1.0.
  # After signs: forward → +1, left → +1, dpad-up/right → +1 (REP-103).
  axis_signs:
    left_stick_x: -1.0
    left_stick_y: -1.0
    right_stick_x: -1.0
    right_stick_y: -1.0
    dpad_x: -1.0
    dpad_y: -1.0

  # Mode-agnostic: gait_mode | posture_mode | animation_mode | init | record
  bindings:
    a: gait_mode
    b: animation_mode
    x: ""
    y: posture_mode
    start: init
    select: record

# Right stick is full 2D translation; left stick is an arcade drive (turn on
# X, forward on Y via drive_x_aux). The two forward sources sum and clip, then
# the whole triple is fitted to the reachable velocity envelope — see the
# package README for what that means for the feel.
gait:
  bindings:
    l1: ""
    r1: ""
    l2: ""
    r2: ""
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

posture:
  bindings:
    l1: yaw_left
    r1: yaw_right
    l2: wiggle_left
    r2: wiggle_right
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    left_stick_x: tilt_roll
    left_stick_y: tilt_pitch
    right_stick_x: pose_y
    right_stick_y: pose_x

  # Posture-mode scalar limits.
  x_max: 0.035 # m
  y_max: 0.035 # m
  roll_max_deg: 12.0
  pitch_max_deg: 12.0
  yaw_max_deg: 20.0
  yaw_tau_s: 0.10 # low-pass for L1/R1 yaw and L2/R2 wiggle
  revert_tau_s: 0.25 # low-pass for Start-button revert
  wiggle_pivot_forward_m: 0.06
  # How fast the D-pad raises/lowers the body. How FAR it may go is not set
  # here — that is the body-height envelope in hexa_description's tuning.yaml
  # (posture_node body_height_max_m / body_height_min_m), which teleop reads.
  height:
    rate_m_per_s: 0.05

animation:
  bindings:
    l1: ""
    r1: ""
    l2: ""
    r2: ""
    dpad_up: ""
    dpad_down: ""
    dpad_left: animation_prev
    dpad_right: animation_next
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

# Web teleop coexistence: when enabled, gamepad publishes only while it owns
# /teleop/owner (default owner "gamepad"). Disable for standalone gamepad.
arbitration:
  enabled: true
