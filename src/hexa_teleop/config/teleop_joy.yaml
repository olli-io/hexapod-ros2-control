# Joystick teleop config — X-input controller (Xbox, 8BitDo, etc.).
# Keys bind to function names (see joy_mapping.ALL_FUNCTIONS); "" is unbound.

initial_mode: gait # gait | posture | animation
allow_unstable_gaits: true # when false, surf and crawl are skipped

# Operator presets: what the Mode view offers, and what the D-pad rotates
# through once one is in force. This is the OPERATOR half of a preset — its id,
# label, gait rotation and entry gait. The physical half — which legs it stands
# on, where those feet sit, and the stride and swing times the walk lays down —
# lives in hexa_description's tuning.yaml under the same ids, and is not
# restated here. In particular a preset's LEG SET is read from there, never
# declared here.
#
# Rotations may OVERLAP: normal, fast and offroad all stand on six legs and all
# offer the same gaits, and it is /cmd_preset that says which preset is in
# force, not the gait name. What load-time validation does require is that every
# gait in a rotation walks the legs its preset stands on, so a prev/next press
# can never ask a standing robot for a leg set the engine would refuse.
#
# Adding a preset is an edit here plus one in tuning.yaml: the active preset's
# rotation is projected onto the one gait_cycle map_joy reads, so the mapping's
# state machine never learns how many there are.
presets:
  default: normal
  # How long the web app's Mode view waits for /gait/preset to change before
  # calling a switch refused. Comfortably over the ~2 s the change takes.
  switch_timeout_s: 4.0
  list:
    - id: normal
      label: NORMAL
      sub: six legs, everyday stance
      gait_cycle: [tripod, surf, tetrapod, crawl, ripple] # fastest → slowest
      default_gait: tripod
    - id: fast
      label: FAST
      sub: low and long-striding
      # The three stable six-leg gaits. Surf and crawl are the ones left out:
      # the preset exists for speed, and crawl on a 0.125 m stride is still
      # crawl.
      gait_cycle: [tripod, tetrapod, ripple] # fastest → slowest
      default_gait: tripod
    - id: offroad
      label: OFFROAD
      sub: tall, short steps, high clearance
      # Two gaits, at the ends of the range: ripple for the ground the preset is
      # for, tripod for getting across the easy stretch between two bits of it.
      gait_cycle: [tripod, ripple]
      # Only reached when the gait in force does not survive the switch — a
      # preset change keeps the walk where the new preset offers it.
      default_gait: tripod
    - id: quad
      label: QUAD
      sub: four corners, middle pair parked
      gait_cycle: [quad_canter, quad_walk]
      default_gait: quad_canter # what `select` stands up on

base:
  deadband: 0.1
  trigger_threshold: 0.5 # analog triggers as binary; press = axis < this

  # sensor_msgs/Joy indices — edit to support a different controller.
  buttons:
    a: 0
    b: 1
    x: 2
    y: 3
    l1: 4
    r1: 5
    select: 6
    start: 7
  axes:
    left_stick_x: 0
    left_stick_y: 1
    l2: 2 # analog trigger, rest=+1.0 pressed=-1.0
    right_stick_x: 3
    right_stick_y: 4
    r2: 5
    dpad_x: 6
    dpad_y: 7

  # Per-axis sign; missing entries default to +1.0.
  # After signs: forward → +1, left → +1, dpad-up/right → +1 (REP-103).
  axis_signs:
    left_stick_x: -1.0
    left_stick_y: -1.0
    right_stick_x: -1.0
    right_stick_y: -1.0
    dpad_x: 1.0
    dpad_y: 1.0

  # Mode-agnostic: gait_mode | posture_mode | animation_mode | init | record
  bindings:
    a: gait_mode
    b: animation_mode
    x: ""
    y: posture_mode
    start: init
    select: record

gait:
  bindings:
    l1: yaw_left
    r1: yaw_right
    l2: wiggle_left
    r2: wiggle_right
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    # Stand up in quadruped mode: the middle pair stays folded and the
    # four corners creep one leg at a time. The select half of the init
    # button — `start` stands the robot up on six legs, this on four, and
    # off the belly either one folds it. Bound here only, so it does
    # nothing in the other two modes, where `select` keeps its base
    # binding (`record`, itself inert outside posture mode).
    select: quadruped_mode
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

posture:
  bindings:
    l1: yaw_left
    r1: yaw_right
    l2: wiggle_left
    r2: wiggle_right
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: gait_prev
    dpad_right: gait_next
    left_stick_x: tilt_roll
    left_stick_y: tilt_pitch
    right_stick_x: pose_y
    right_stick_y: pose_x

  height:
    rate_m_per_s: 0.05

animation:
  bindings:
    l1: ""
    r1: ""
    l2: ""
    r2: ""
    dpad_up: height_up
    dpad_down: height_down
    dpad_left: animation_prev
    dpad_right: animation_next
    left_stick_x: drive_yaw
    left_stick_y: drive_x_aux
    right_stick_x: drive_y
    right_stick_y: drive_x

# When enabled, the gamepad publishes only while it owns /teleop/owner
# (default owner "gamepad"). Disable for standalone gamepad.
arbitration:
  enabled: true
