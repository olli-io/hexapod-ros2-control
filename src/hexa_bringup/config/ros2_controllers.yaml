# ros2_control controller manager + controller config for the real hexapod.
#
# Loaded by ros2_control_node in hexa_bringup/launch/robot.launch.py. Mirrors
# hexa_simulation's copy except for use_sim_time.

controller_manager:
  ros__parameters:
    update_rate: 200 # Hz
    use_sim_time: false

    # SCHED_FIFO priority for the control thread. 50 is above every SCHED_OTHER
    # thread on the Pi, which is what stopped the idle-robot overruns (~5.4-6.0
    # ms stalls). Well under 99 deliberately: at 90+ a spin here can starve
    # kernel workers badly enough to take ssh down. If hexa_locomotion is ever
    # promoted to RT it must sit *below* this.
    #
    # Needs a non-zero rtprio ulimit in the container (docker-compose.robot.yaml)
    # or the node logs "Could not enable FIFO RT scheduling policy" and carries
    # on at normal priority. On a PREEMPT_RT kernel the irq/* threads sit at 50
    # and this wants to be 49.
    thread_priority: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

joint_group_position_controller:
  ros__parameters:
    joints:
      - l_front_coxa_joint
      - l_front_femur_joint
      - l_front_tibia_joint
      - l_middle_coxa_joint
      - l_middle_femur_joint
      - l_middle_tibia_joint
      - l_rear_coxa_joint
      - l_rear_femur_joint
      - l_rear_tibia_joint
      - r_front_coxa_joint
      - r_front_femur_joint
      - r_front_tibia_joint
      - r_middle_coxa_joint
      - r_middle_femur_joint
      - r_middle_tibia_joint
      - r_rear_coxa_joint
      - r_rear_femur_joint
      - r_rear_tibia_joint
