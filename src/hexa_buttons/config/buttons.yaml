button_node:
  ros__parameters:
    # Read by robot.launch.py: false skips the node.
    enabled: true

    # --- Wiring ---
    # Switch between BCM line and ground, SoC pull-up. Container-side chip path.
    gpio_chip: "/dev/gpiochip0"
    info_line: 5 # battery + address; hold: network mode
    bluetooth_line: 6 # controller status; hold: pair
    # Collapse onto gpiozero pull_up/active_state (pull_kwargs in screen_logic.py).
    # active_low: false + bias_pull_up: true is rejected at startup.
    active_low: true
    bias_pull_up: true

    # --- Timing ---
    # Housekeeping tick; also bounds press latency. Edges are not polled.
    tick_rate_hz: 20.0
    debounce_s: 0.03
    # Hold time for both buttons; the screens advertise this number.
    hold_s: 3.0
    screen_timeout_s: 6.0
    # Backstop; a non-empty /bluetooth/status or either button ends a scan earlier.
    scan_timeout_s: 30.0

    # --- Battery screen ---
    battery_topic: /hexa_hardware_aux/battery_state
    # 2S LiPo voltage -> percentage, screen number only. Safety ladder is
    # `battery:` in hexa_description/config/hardware.yaml.
    battery_empty_v: 6.6
    battery_full_v: 8.4

    # Overridden at launch from webteleop.yaml server.port.
    control_port: 8080
    # Station-mode name, e.g. "hexa.local". Empty shows the IP. Set only after
    # `./hexa robot install-mdns`. Ignored on the hotspot.
    mdns_name: ""
    # Preference order; unlisted interfaces used only as a fallback.
    ip_interfaces: ["wlan0", "eth0"]

    # --- Network mode switch (info button, hold) ---
    # Request file -> host systemd .path unit -> systemd/network-mode.sh.
    # Inert until `./hexa robot install-network`.
    network_toggle_enabled: true
    # Container-side paths. Spool is written here, state file by the host.
    network_spool: /workspace/log/network
    network_state_file: /workspace/log/network.state
    # No `result=switching` within this: units not installed.
    network_ack_timeout_s: 5.0
    # Host acked but never finished.
    network_timeout_s: 60.0
    # Result screen carries a password, so it stays longer.
    network_info_timeout_s: 20.0
    # SSID and password live in network-mode.sh and come back in the state file.

    # ASCII only: the panel font has no U+2192.
    label_arrow: "->"
