display_node:
  ros__parameters:
    # false skips the face node in the bringup launch files.
    enabled: true

    update_rate_hz: 10.0

    # One param per gait state. Valid values: neutral, happy, sleepy, dead,
    # greedy, woozy, angry, love, scanning.
    expression_map.folded: sleepy
    expression_map.initialize: neutral
    expression_map.stand: neutral
    expression_map.engaging: neutral
    expression_map.gait: neutral
    expression_map.settling: neutral
    expression_map.reseating: neutral
    expression_map.folding_pair: neutral
    expression_map.unfolding_pair: neutral
    expression_map.folding: sleepy

    animation_expression: woozy

    # Pose mode: left stick tilts, right stick shifts. A stick holds until it
    # drops under threshold * posture_exit_ratio. 0.0 disables that stick.
    posture_tilt_expression: happy
    posture_shift_expression: love
    posture_both_expression: angry
    posture_tilt_threshold_rad: 0.03
    posture_shift_threshold_m: 0.005
    posture_exit_ratio: 0.6

    scanning_expression: scanning

    # Warning shows only when idle, critical always. 0.0 disables a threshold.
    # Face only — the safety ladder is `battery:` in hardware.yaml.
    battery_topic: /hexa_hardware_aux/battery_state
    battery_warning_expression: sleepy
    battery_critical_expression: dead
    battery_warning_v: 0.0
    battery_critical_v: 0.0
    battery_hysteresis_v: 0.3
    battery_hold_s: 3.0

    # Horizontal gaze from cmd_vel: normalized by the *_max caps, then
    # sign-quantized with enter/exit hysteresis.
    gaze_deadband: 0.15
    gaze_exit_ratio: 0.6
    gaze_wz_weight: 1.0
    gaze_vy_max: 0.1
    gaze_wz_max: 0.5

    # Gaze from body tilt.
    pose_pitch_threshold_rad: 0.08
    pose_tilt_threshold_rad: 0.08

    # Idling look-around starts after this long idle and level.
    idling_start_delay_s: 4.0

    # --- SH1122 panel ---

    spi_device: "/dev/spidev0.0"
    spi_speed_hz: 8000000

    # BCM line offsets. cs_line: -1 leaves CS to the SPI controller (Pi 5).
    gpio_chip: "/dev/gpiochip0"
    dc_line: 24
    rst_line: 25
    cs_line: -1

    render_hz: 60

    # Full pipeline without SPI/GPIO (sim / CI).
    headless: false

# Consumed only by the Pi Pico firmware config codegen.
pico_panel:
  enabled: true
  spi_index: 0
  sck: 18
  mosi: 19
  cs: 17
  dc: 20
  rst: 21
  spi_hz: 25000000
  render_hz: 30
