name: release

on:
  push:
    tags:
      - 'release-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a prerelease instead of only building'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse tags that are not on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main — refusing to release"; exit 1; }

      - name: Derive tag and version
        id: names
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              tag="${GITHUB_REF_NAME}"
              version="${tag#release-}"
          else
              version="$(git rev-parse --short HEAD)"
              tag="dryrun-${version}"
          fi
          {
              echo "tag=${tag}"
              echo "version=${version}"
              echo "tarball=hexa-robot_arm64_${tag}.tar.gz"
          } >> "${GITHUB_OUTPUT}"
          echo ">> ${tag} -> hexa-robot:${version}"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Build the ARM64 robot image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f robot.Dockerfile \
            -t "hexa-robot:${{ steps.names.outputs.version }}" \
            -t "hexa-robot:latest" \
            --output type=docker \
            .

      - name: Save and compress the image
        run: |
          docker save \
            "hexa-robot:${{ steps.names.outputs.version }}" \
            "hexa-robot:latest" \
            | gzip > "${{ steps.names.outputs.tarball }}"
          ls -lh "${{ steps.names.outputs.tarball }}"
          df -h /

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.names.outputs.tag }}
          TARBALL: ${{ steps.names.outputs.tarball }}
        run: |
          prerelease=""
          [ "${GITHUB_EVENT_NAME}" = "push" ] || prerelease="--prerelease"
          if gh release view "${TAG}" >/dev/null 2>&1; then
              echo ">> ${TAG} already exists — replacing its asset"
              gh release upload "${TAG}" "${TARBALL}" --clobber
          else
              gh release create "${TAG}" \
                  --title "${TAG}" \
                  --generate-notes \
                  ${prerelease} \
                  "${TARBALL}"
          fi
          echo ">> published ${TAG}${prerelease:+ (prerelease)}"

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          echo ">> Dry run: built ${{ steps.names.outputs.tarball }}, no release created"
