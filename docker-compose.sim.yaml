# Shared by the mutually exclusive sim and pico services.
x-hexa-base: &hexa_base
  build:
    context: .
    dockerfile: sim.Dockerfile
    args:
      USER_UID: "${UID:-1000}"
      USER_GID: "${GID:-1000}"
  image: hexa-sim:jazzy
  network_mode: host
  ipc: host
  working_dir: /workspace
  group_add:
    - "${INPUT_GID:-992}"
  environment:
    DISPLAY: "${DISPLAY:-:0}"
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
    XDG_RUNTIME_DIR: "/tmp/runtime-dev"
    # The custom hostname does not resolve under host networking.
    GZ_IP: "127.0.0.1"
  volumes:
    - .:/workspace
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-${HOME}/.Xauthority}:/home/dev/.Xauthority:ro
    # rshared bind, not `devices:`, so hot-plugged joysticks appear.
    - type: bind
      source: /dev/input
      target: /dev/input
      bind:
        propagation: rshared
  device_cgroup_rules:
    - 'c 13:* rmw'
  # Servo 2040:
  # devices:
  #   - "/dev/ttyACM0:/dev/ttyACM0"

services:
  sim:
    <<: *hexa_base
    container_name: hexa-sim
    hostname: hexa-sim
    command: ["ros2", "launch", "hexa_bringup", "sim_bringup.launch.py"]

  pico:
    <<: *hexa_base
    container_name: hexa-pico
    hostname: hexa-pico
    command: ["ros2", "launch", "hexa_pico_bridge", "bridge.launch.py"]
