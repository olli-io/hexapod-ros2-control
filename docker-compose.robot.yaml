services:
  robot:
    image: hexa-robot:latest
    container_name: hexa-robot
    hostname: hexa-robot
    network_mode: host
    ipc: host
    restart: unless-stopped
    working_dir: /workspace
    # Supplementary GIDs for the container user. INPUT_GID forwards the Pi's
    # `input` group so joy_node can read /dev/input/event* (the joystick).
    group_add:
      - "${INPUT_GID:-994}"
    # Process-level environment for the ROS stack, sourced from .env (the same
    # file deploy seeds from .env.robot.sample, at ~/hexa-robot/.env). Any
    # ROS-facing var added there flows into the container without editing this
    # file. Optional so compose still parses on a host without a .env. Note the
    # device / GID vars below stay as ${...} interpolations by necessity —
    # they configure the container itself at create time, not the process env —
    # and env changes still require a container recreate (`hexa robot restart`),
    # never a bare `docker compose restart`.
    env_file:
      - path: .env
        required: false
    # Servo 2040 over USB-CDC. SERVO_DEVICE defaults to /dev/ttyACM0 — set it
    # to a /dev/serial/by-id/... path in .env once the actual device string
    # is known, so a re-enumerated bus number doesn't break startup.
    devices:
      - "${SERVO_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
      # ESP32 face on the Pi UART header. Map the resolved PL011 node
      # (not the /dev/serial0 symlink) into the container under the
      # name the display node expects. Requires enable_uart=1 +
      # dtoverlay=disable-bt on the Pi; see docs/robot-environment.md.
      - "${DISPLAY_DEVICE:-/dev/ttyAMA0}:/dev/serial0"
    # Joystick passthrough (same shape as the dev compose): bind /dev/input
    # rshared so hot-plugged controllers become visible without restarting
    # the container; device_cgroup_rules grants char-device access.
    volumes:
      - type: bind
        source: /dev/input
        target: /dev/input
        bind:
          propagation: rshared
      - ./log:/workspace/log
      # Runtime-tuning overlay, mounted over the image's baked copy so an edit
      # to ~/hexa-robot/tuning.yaml applies on a bare `hexa robot restart` — the
      # node re-reads it at startup, no image rebuild and no container recreate.
      # Deploy seeds this file from tuning.yaml.default; if it's absent the node
      # falls through to the packages' base YAML defaults.
      - ./tuning.yaml:/workspace/install/share/hexa_description/config/tuning.yaml:ro
    device_cgroup_rules:
      - 'c 13:* rmw'
