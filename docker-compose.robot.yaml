services:
  robot:
    image: hexa-robot:latest
    container_name: hexa-robot
    hostname: hexa-robot
    network_mode: host
    ipc: host
    restart: unless-stopped
    working_dir: /workspace
    # See docs/robot-environment.md for the GID values.
    group_add:
      - "${INPUT_GID:-994}"
      - "${SPI_GID:-999}"
      - "${GPIO_GID:-993}"
    env_file:
      - path: .env
        required: false
    # Pi 4: SERVO_DEVICE=/dev/ttyS0 (see docs/robot-environment.md).
    devices:
      - "${SERVO_DEVICE:-/dev/ttyAMA0}:/dev/ttyAMA0"
      - "${SPI_DEVICE:-/dev/spidev0.0}:/dev/spidev0.0"
      - "${GPIO_CHIP:-/dev/gpiochip0}:/dev/gpiochip0"
    volumes:
      # rshared bind, not `devices:`, so hot-plugged joysticks appear.
      - type: bind
        source: /dev/input
        target: /dev/input
        bind:
          propagation: rshared
      - ./log:/workspace/log
      - ./tuning.yaml:/workspace/install/share/hexa_description/config/tuning.yaml:ro
      - ./servo_calibration.yaml:/workspace/install/share/hexa_description/config/servo_calibration.yaml:ro
    device_cgroup_rules:
      - 'c 13:* rmw'
    # Lets ros2_control_node use SCHED_FIFO.
    ulimits:
      rtprio: 99
